plugins { id 'com.android.application' }

android {
    namespace 'com.akira.mori'
    compileSdk 35
    defaultConfig {
        applicationId 'com.akira.mori'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'START_URL', '"https://mori-z-hub.vercel.app"'
    }
    buildFeatures { buildConfig true }
}
