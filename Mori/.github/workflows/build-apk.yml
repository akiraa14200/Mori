name: Build Mori APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mori
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build universal debug APK
        run: ./gradlew :app:assembleUniversalDebug --no-daemon --stacktrace

      - name: Upload Mori APK
        uses: actions/upload-artifact@v4
        with:
          name: Mori-universal-debug-apk
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
