<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b0c10"><title>Ryko Anime</title>
<style>
:root{--bg:#0b0c10;--panel:#15171e;--panel2:#1c1f28;--gold:#d7b86a;--muted:#9699a6;--line:#292c36;--white:#f5f4ef}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#302817 0,transparent 34%),var(--bg);color:var(--white);font:15px system-ui,-apple-system,sans-serif;padding-bottom:90px}button,input{font:inherit}header{padding:22px 18px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#0b0c10ed;backdrop-filter:blur(18px);z-index:5;border-bottom:1px solid #ffffff0a}.brand{font-size:22px;font-weight:800;letter-spacing:-1px}.brand span{color:var(--gold)}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:2px;font-weight:800}.avatar{width:36px;height:36px;border-radius:13px;background:linear-gradient(135deg,#d7b86a,#80652c);display:grid;place-items:center;color:#17130a;font-weight:900}.wrap{padding:16px 16px 0}.hero{min-height:220px;border-radius:24px;overflow:hidden;position:relative;background:#24242a center/cover;display:flex;align-items:end;padding:20px;margin:6px 0 22px}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#090a0df2,transparent 85%)}.hero-content{position:relative;z-index:1;max-width:80%}.hero h1{font-size:27px;line-height:1.05;margin:7px 0}.hero p{color:#d0d0d0;font-size:12px;margin:7px 0}.pill{border:1px solid #d7b86a77;color:var(--gold);border-radius:20px;padding:5px 9px;font-size:10px;display:inline-block}.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.section-head h2{font-size:18px;margin:0;letter-spacing:-.4px}.sub{font-size:11px;color:var(--muted)}.search{display:flex;gap:9px;background:var(--panel);border:1px solid var(--line);padding:12px 14px;border-radius:16px;margin:8px 0 18px}.search input{background:none;border:0;outline:0;color:white;width:100%}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:#c4c5cc;border-radius:20px;padding:8px 13px;font-size:12px}.chip.active{background:#d7b86a;color:#15130e;border-color:#d7b86a;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{min-width:0;background:var(--panel);border:1px solid #ffffff0b;border-radius:17px;overflow:hidden;position:relative}.cover{width:100%;aspect-ratio:3/4;object-fit:cover;background:#242630;display:block}.card-body{padding:10px}.card-title{font-weight:700;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:33px}.meta{color:var(--muted);font-size:10px;margin-top:6px}.score{color:var(--gold)}.fav{position:absolute;top:8px;right:8px;border:0;border-radius:50%;width:32px;height:32px;background:#111c;color:white;font-size:17px}.tabs{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#111218ed;backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom))}.tab{border:0;background:none;color:#9295a1;font-size:10px;display:grid;gap:4px;justify-items:center}.tab b{font-size:19px;font-weight:500}.tab.active{color:var(--gold)}.empty,.loading{color:var(--muted);padding:28px;text-align:center;grid-column:1/-1}.detail{position:fixed;inset:0;background:#090a0df5;z-index:20;overflow:auto;padding:18px;display:none}.detail.open{display:block}.close{border:1px solid var(--line);background:var(--panel);color:white;border-radius:12px;padding:9px 13px}.detail img{width:130px;border-radius:16px;float:left;margin:16px 16px 12px 0}.detail h2{margin:18px 0 8px}.detail p{color:#c4c5cc;line-height:1.6;font-size:13px}.action{background:var(--gold);color:#17130a;border:0;border-radius:13px;padding:11px 14px;font-weight:800;margin:5px 6px 5px 0}.ghost{background:var(--panel2);color:white;border:1px solid var(--line);border-radius:13px;padding:11px 14px}.hide{display:none!important}
</style></head><body>
<header><div><div class="eyebrow">DISCOVER YOUR NEXT STORY</div><div class="brand">ryko<span>.</span>anime</div></div><div class="avatar">R</div></header>
<main class="wrap" id="home">
<div class="hero" id="hero"><div class="hero-content"><span class="pill">YOUR ANIME SPACE</span><h1>Find your<br>next favourite.</h1><p>Discover, save and keep track of the stories you love.</p></div></div>
<div class="search">⌕ <input id="query" placeholder="Search anime titles..." autocomplete="off"><button id="searchBtn" class="chip">Search</button></div>
<div class="chips" id="genres"><button class="chip active" data-genre="">All</button><button class="chip" data-genre="Action">Action</button><button class="chip" data-genre="Adventure">Adventure</button><button class="chip" data-genre="Comedy">Comedy</button><button class="chip" data-genre="Drama">Drama</button><button class="chip" data-genre="Fantasy">Fantasy</button><button class="chip" data-genre="Mystery">Mystery</button><button class="chip" data-genre="Sci-Fi">Sci-Fi</button><button class="chip" data-genre="Slice of Life">Slice of Life</button></div>
<section><div class="section-head"><h2 id="sectionTitle">Trending now</h2><span class="sub" id="resultCount">AniList catalogue</span></div><div class="grid" id="results"><div class="loading">Loading anime…</div></div></section>
<section id="seasonSection"><div class="section-head"><h2>Popular picks</h2><span class="sub">Picked for discovery</span></div><div class="grid" id="popular"></div></section>
</main>
<main class="wrap hide" id="library"><div class="section-head"><h2>Your library</h2><span class="sub">Saved on this device</span></div><div class="chips"><button class="chip active" data-filter="all">All saved</button><button class="chip" data-filter="watching">Watching</button><button class="chip" data-filter="completed">Completed</button><button class="chip" data-filter="planning">Plan to watch</button></div><div class="grid" id="savedGrid"></div></main>
<nav class="tabs"><button class="tab active" data-page="home"><b>⌂</b>Discover</button><button class="tab" data-page="library"><b>▤</b>My Library</button><button class="tab" data-page="search"><b>⌕</b>Search</button></nav>
<div class="detail" id="detail"><button class="close" id="closeDetail">← Back</button><div id="detailContent"></div></div>
<script>
const API='https://graphql.anilist.co';let current=[],saved=JSON.parse(localStorage.getItem('ryko-saved')||'{}'),activeGenre='',libraryFilter='all';
const q=s=>document.querySelector(s), esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function gql(query,variables={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables})});if(!r.ok)throw Error('Catalogue unavailable');return (await r.json()).data}
const fields='id title { romaji english native } coverImage { extraLarge large } bannerImage averageScore episodes seasonYear genres description format status siteUrl trailer { site id }';
function card(a){let title=a.title.english||a.title.romaji;return '<article class="card" data-id="'+a.id+'"><img class="cover" loading="lazy" src="'+(a.coverImage.large||'')+'" alt="'+esc(title)+'"><button class="fav" data-fav="'+a.id+'">'+(saved[a.id]?'♥':'♡')+'</button><div class="card-body"><div class="card-title">'+esc(title)+'</div><div class="meta"><span class="score">★ '+(a.averageScore? a.averageScore+'%':'—')+'</span> · '+(a.seasonYear||'TBA')+' · '+esc(a.format||'Anime')+'</div></div></article>'}
async function load(query='',genre=''){q('#results').innerHTML='<div class="loading">Finding anime…</div>';try{let filter=query?{search:query,type:'ANIME',isAdult:false,genre_in:genre?[genre]:undefined,sort:['SEARCH_MATCH'] }:{type:'ANIME',isAdult:false,genre_in:genre?[genre]:undefined,sort:['TRENDING_DESC']};let d=await gql('query ($search:String,$type:MediaType,$isAdult:Boolean,$genre_in:[String],$sort:[MediaSort]) { Page(perPage:20) { media(search:$search,type:$type,isAdult:$isAdult,genre_in:$genre_in,sort:$sort) {'+fields+'} } }',filter);current=d.Page.media;q('#results').innerHTML=current.map(card).join('')||'<div class="empty">No titles found. Try another search.</div>';q('#resultCount').textContent=current.length+' titles';q('#sectionTitle').textContent=query?'Search results':genre?genre+' anime':'Trending now';}catch(e){q('#results').innerHTML='<div class="empty">Could not load the catalogue. Check your connection and try again.</div>'}}
async function popular(){try{let d=await gql('query { Page(perPage:6) { media(type:ANIME,isAdult:false,sort:SCORE_DESC) {'+fields+'} } }');q('#popular').innerHTML=d.Page.media.map(card).join('')}catch(e){q('#popular').innerHTML='<div class="empty">Popular picks will appear when connected.</div>'}}
function persist(){localStorage.setItem('ryko-saved',JSON.stringify(saved));}
function toggleSave(id){let a=[...current,...(window.popularList||[])].find(x=>x.id==id);if(saved[id])delete saved[id];else if(a)saved[id]={...a,progress:0,status:'planning'};persist();renderSaved();load(q('#query').value,activeGenre)}
function renderSaved(){let arr=Object.values(saved).filter(a=>libraryFilter==='all'||a.status===libraryFilter);q('#savedGrid').innerHTML=arr.map(card).join('')||'<div class="empty">Your library is empty. Save a title with the ♡ button.</div>'}
async function openDetail(id){let a=current.find(x=>x.id==id)||saved[id];if(!a){try{let d=await gql('query ($id:Int){Media(id:$id,type:ANIME){'+fields+'}}',{id:+id});a=d.Media}catch(e){return}}q('#detailContent').innerHTML='<img src="'+a.coverImage.extraLarge+'" alt=""><h2>'+esc(a.title.english||a.title.romaji)+'</h2><div class="meta">★ '+(a.averageScore||'—')+' · '+(a.seasonYear||'TBA')+' · '+esc(a.format||'Anime')+' · '+(a.episodes||'?')+' episodes</div><p>'+esc((a.description||'No synopsis available.').replace(/<[^>]*>/g,' '))+'</p><p>'+esc((a.genres||[]).join(' · '))+'</p><button class="action" id="saveDetail">'+(saved[a.id]?'Saved ♥':'Add to library ♡')+'</button><button class="ghost" id="progressBtn">Update progress</button><button class="ghost" id="aniBtn">AniList details ↗</button>'+(a.trailer&&a.trailer.site==='youtube'?'<button class="ghost" id="trailerBtn">Trailer ↗</button>':'');q('#detail').classList.add('open');q('#saveDetail').onclick=()=>{toggleSave(a.id);q('#saveDetail').textContent=saved[a.id]?'Saved ♥':'Add to library ♡'};q('#progressBtn').onclick=()=>{if(!saved[a.id])saved[a.id]={...a,progress:0,status:'watching'};let p=prompt('Episodes watched (0-'+(a.episodes||999)+')',saved[a.id].progress||0);if(p!==null){saved[a.id].progress=Math.max(0,parseInt(p)||0);saved[a.id].status=a.episodes&&saved[a.id].progress>=a.episodes?'completed':'watching';persist();renderSaved()}};q('#aniBtn').onclick=()=>window.location.href=a.siteUrl;q('#trailerBtn')?.addEventListener('click',()=>window.location.href='https://www.youtube.com/watch?v='+a.trailer.id)}
q('#closeDetail').onclick=()=>q('#detail').classList.remove('open');
document.addEventListener('click',e=>{let f=e.target.closest('[data-fav]'),c=e.target.closest('.card');if(f){e.stopPropagation();toggleSave(+f.dataset.fav)}else if(c)openDetail(+c.dataset.id)});
q('#searchBtn').onclick=()=>load(q('#query').value,activeGenre);q('#query').addEventListener('keydown',e=>{if(e.key==='Enter')load(q('#query').value,activeGenre)});
q('#genres').onclick=e=>{let b=e.target.closest('[data-genre]');if(!b)return;activeGenre=b.dataset.genre;q('#genres').querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));load(q('#query').value,activeGenre)};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));let page=b.dataset.page;if(page==='search'){q('#query').focus();return}q('#home').classList.toggle('hide',page!=='home');q('#library').classList.toggle('hide',page!=='library');if(page==='library')renderSaved()});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{libraryFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderSaved()});
load();popular();
</script></body></html>
