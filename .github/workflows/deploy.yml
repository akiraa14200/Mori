name: Validate Mori
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test character description normalization
        run: node tests/character-text.test.js
      - name: Check serverless news API syntax
        run: node --check api/news.js
      - name: Check Cloudflare Worker module syntax
        run: node --input-type=module --check < cloudflare/worker.js
      - name: Check inline browser JavaScript and required app files
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(code => code.trim());
          if (!scripts.length) throw new Error('No inline application JavaScript found');
          scripts.forEach((code, index) => {
            try { new Function(code); }
            catch (error) { throw new Error(`Inline script ${index + 1} failed syntax check: ${error.message}`); }
          });
          for (const file of ['config.js', 'api/news.js', 'supabase/schema.sql', 'cloudflare/worker.js', 'cloudflare/schema.sql', 'cloudflare/wrangler.toml']) {
            if (!fs.existsSync(file)) throw new Error(`Required file missing: ${file}`);
          }
          const config = fs.readFileSync('config.js', 'utf8');
          if (!config.includes('supabaseUrl') || !config.includes('supabaseKey') || !config.includes('cloudflareD1Url')) {
            throw new Error('Supabase or Cloudflare D1 browser configuration is incomplete');
          }
          console.log(`Validated ${scripts.length} inline script(s), Cloudflare Worker syntax and required project files.`);
          NODE
