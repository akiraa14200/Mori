name: Preview syntax check
on:
  push:
    branches: [remove-footer-credits, main, catalogue-video-performance]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  inline-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run project regression tests
        run: node --test tests/*.test.js
      - name: Test character description normalization
        run: node tests/character-text.test.js
      - name: Test D1 sync safety
        run: node tests/worker-sync.test.js
      - name: Check Cloudflare Worker module syntax
        run: node --input-type=module --check < cloudflare/worker.js
      - name: Check inline JavaScript in index.html
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(m => m[1]).filter(s => s.trim());
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((script, i) => {
            try { new vm.Script(script, { filename: 'index.html:inline-script-' + (i + 1) }); }
            catch (error) { console.error(error); process.exitCode = 1; }
          });
          console.log('Checked ' + scripts.length + ' inline scripts.');
          NODE
