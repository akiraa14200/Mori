name: Build Ryko Anime APK
on:
  workflow_dispatch:
  push:
    branches: [ryko-anime]
    paths:
      - 'anime-android/**'
      - '.github/workflows/build-ryko-anime.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: anime-android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ryko-Anime-debug-APK
          path: anime-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
