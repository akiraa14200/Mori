name: Build Ryko Collection Android APK
on:
  push:
    branches: [ryko-native-android]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-ryko-native-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android-native
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ryko-Collection-debug-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
