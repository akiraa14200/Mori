<script>
(()=>{'use strict';
const cfg=window.APP_CONFIG||{},app=document.getElementById('app'),toastNode=document.getElementById('toast');
if(!window.supabase||!cfg.supabaseUrl||!cfg.supabaseKey){app.innerHTML='<div class="empty">Site configuration is missing. Check config.js and the Supabase client.</div>';return}
const db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state={titles:[],filtered:[],user:null,admin:false,route:'/',selected:null,characters:[],library:new Set(),reviews:[],comments:[],slide:0,filter:'All',search:'',loading:false,settings:{},news:[],newsLoaded:false,newsLoading:false,newsFilter:'All',releases:[],releaseLoading:false,newsUpdatedAt:null};
let carouselTimer=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>{try{const u=new URL(v,location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};
const img=(url,alt='')=>safeUrl(url)||'';
const fmtDate=v=>v?new Date(v).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'Recently added';
function notify(msg){toastNode.textContent=msg;toastNode.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toastNode.classList.add('hidden'),3200)}
function titleName(t){return t?.name||t?.title||'Untitled'}
function media(t){return t?.media_type||t?.type||'Manga'}
function card(t){return '<article class="card" data-open="'+esc(t.id)+'" tabindex="0" role="button" aria-label="Open '+esc(titleName(t))+'"><div class="cover"><img loading="lazy" src="'+esc(img(t.cover_url))+'" alt="'+esc(titleName(t))+'" onerror="this.style.opacity=.15"><span class="badge">'+esc(media(t))+'</span><span class="rating">★ '+esc(Number(t.rating||0).toFixed(1))+'</span></div><h3>'+esc(titleName(t))+'</h3><div class="meta">'+esc(t.release_year||'—')+' · '+esc(t.status||'Ongoing')+'</div></article>'}
function grid(list){return list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="empty">No titles found yet. Try another search or check back soon.</div>'}
function topTitle(text,sub=''){return '<div class="section-head"><div><h2>'+esc(text)+'</h2>'+(sub?'<p class="muted small">'+esc(sub)+'</p>':'')+'</div></div>'}
async function loadTitles(){const {data,error}=await db.from('titles').select('*').order('created_at',{ascending:false}).limit(1000);if(error){console.error(error);notify('Could not load catalogue: '+error.message);return}state.titles=data||[];applyFilters()}
function applyFilters(){const q=state.search.toLowerCase().trim();state.filtered=state.titles.filter(t=>{const matches=!q||[t.name,...(t.alternative_names||[]),t.synopsis,...(t.genres||[])].filter(Boolean).join(' ').toLowerCase().includes(q);const kind=state.filter==='All'||media(t)===state.filter;return matches&&kind})}
async function refreshUser(){const {data,error:userError}=await db.auth.getUser();if(userError)console.warn('Could not read auth user',userError.message);state.user=data?.user||null;state.admin=false;state.library.clear();state.adminCheckError='';if(state.user){const [a,l]=await Promise.all([db.from('admin_users').select('user_id').eq('user_id',state.user.id).maybeSingle(),db.from('user_library').select('title_id').eq('user_id',state.user.id)]);state.adminCheckError=a.error?.message||'';state.admin=!!a.data&&!a.error;(l.data||[]).forEach(x=>state.library.add(x.title_id))}document.getElementById('account-btn').textContent=state.user?(state.user.email?.split('@')[0]||'Account'):'Sign in';return {user:state.user,admin:state.admin,adminError:state.adminCheckError}}
function hero(){const list=[...state.titles].sort((a,b)=>Number(!!b.is_featured)-Number(!!a.is_featured)||Number(!!b.is_trending)-Number(!!a.is_trending)||new Date(b.created_at)-new Date(a.created_at));if(!list.length)return '<section class="hero"><div class="hero-copy"><div class="eyebrow">Welcome to 7MANGA</div><h1>Stories beyond worlds.</h1><p>Your next obsession starts here. Browse the catalogue and find a world worth getting lost in.</p><a class="btn primary" href="#/browse">Explore catalogue ↗</a></div></section>';const t=list[state.slide%list.length];return '<section class="hero"><img class="hero-art" src="'+esc(img(t.banner_url||t.cover_url))+'" alt="" onerror="this.style.display=\'none\'"><div class="hero-copy"><div class="eyebrow">'+(t.is_featured?'✦ Featured story':'✦ Discover something new')+'</div><h1>'+esc(titleName(t))+'</h1><div class="pills"><span class="pill">'+esc(media(t))+'</span><span class="pill">★ '+esc(Number(t.rating||0).toFixed(1))+'</span><span class="pill">'+esc(t.status||'Ongoing')+'</span></div><div class="hero-actions"><button class="btn primary" data-open="'+esc(t.id)+'">Explore title ↗</button><button class="btn" data-save="'+esc(t.id)+'">'+(state.library.has(t.id)?'♥ In library':'♡ Add to library')+'</button></div><div class="dots">'+list.slice(0,6).map((_,i)=>'<button aria-label="Slide '+(i+1)+'" class="dot '+(i===state.slide%Math.min(6,list.length)?'active':'')+'" data-slide="'+i+'"></button>').join('')+'</div></div></section>'}
function home(){const titles=state.filtered;return hero()+'<section class="section">'+topTitle('Made for your next binge','Freshly added to the 7MANGA catalogue')+grid([...state.titles].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,12))+'</section><section class="section">'+topTitle('Trending now','Stories readers are checking out')+grid([...state.titles].filter(t=>t.is_trending).sort((a,b)=>Number(b.popularity||0)-Number(a.popularity||0)).slice(0,12))+'</section><section class="section">'+topTitle('Explore the catalogue','Find your next favourite')+filters()+grid(titles.slice(0,18))+(titles.length>18?'<div style="text-align:center;margin-top:22px"><a class="btn" href="#/browse">View all titles →</a></div>':'')+'</section>'}
function filters(){const types=['All','Manga','Manhwa','Manhua','Anime','Light Novel','Web Novel'];return '<div class="filters">'+types.map(x=>'<button class="chip '+(state.filter===x?'active':'')+'" data-filter="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>'}
function browse(){return '<section class="section">'+topTitle('Explore stories','Search by title, genre, or alternative name')+filters()+grid(state.filtered)+'</section>'}
function facts(t){const pairs=[['Type',media(t)],['Status',t.status],['Release',t.release_year],['Chapters',t.chapters],['Episodes',t.episodes],['Author',t.author],['Artist',t.artist],['Studio',t.studio],['Country',t.country],['Season',t.season],['Source',t.source_url?'<a target="_blank" rel="noopener" href="'+esc(img(t.source_url))+'">Open source ↗</a>':'—']];return '<div class="facts">'+pairs.filter(([k,v])=>v).map(([k,v])=>'<div class="fact"><label>'+esc(k)+'</label><strong>'+(k==='Source'?v:esc(v))+'</strong></div>').join('')+'</div>'}
async function openTitle(id){const t=state.titles.find(x=>x.id===id);if(!t)return notify('This title is no longer available.');state.selected=t;state.route='/title/'+id;history.pushState({route:state.route},'', '#'+state.route);await loadEntryExtras(id);render();loadEntryTrailer(t)}
async function loadEntryTrailer(t){const box=document.getElementById('entry-trailer');if(!box)return;box.innerHTML='';if(!t?.anilist_id)return;try{const query='query ($id:Int){Media(id:$id){trailer{id site}}}';const res=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables:{id:Number(t.anilist_id)}})});if(!res.ok)return;const json=await res.json();const trailer=json.data?.Media?.trailer;if(!trailer?.id||!['youtube','dailymotion'].includes(String(trailer.site||'').toLowerCase()))return;const site=String(trailer.site).toLowerCase();const embed=site==='youtube'?'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(trailer.id):'https://www.dailymotion.com/embed/video/'+encodeURIComponent(trailer.id);const current=document.getElementById('entry-trailer');if(!current||state.selected?.id!==t.id)return;current.innerHTML='<div style="margin-top:24px"><h3 style="font-size:17px;margin:0 0 12px">Trailer</h3><div style="position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:15px;border:1px solid var(--line);background:#08080b"><iframe src="'+esc(embed)+'" title="'+esc(titleName(t))+' trailer" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div></div>'}catch(error){console.warn('Trailer lookup failed',error)}}
async function loadEntryExtras(id){const [ch,re,co]=await Promise.all([db.from('characters').select('*').eq('title_id',id).order('created_at',{ascending:false}).limit(60),db.from('title_reviews').select('id,user_id,rating,review,created_at,updated_at').eq('title_id',id).eq('is_hidden',false).order('created_at',{ascending:false}).limit(50),db.from('community_comments').select('id,user_id,body,media_url,media_type,created_at').eq('title_id',id).order('created_at',{ascending:false}).limit(50)]);state.characters=ch.data||[];state.reviews=re.data||[];state.comments=co.data||[];if(ch.error)console.warn(ch.error);if(re.error)console.warn(re.error);if(co.error)console.warn(co.error)}
function reviewCards(){const list=[...state.reviews.map(x=>({...x,kind:'review',body:x.review})),...state.comments.map(x=>({...x,kind:'comment'}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));if(!list.length)return '<div class="empty">No comments yet. Be the first to share your thoughts.</div>';return '<div class="review-list">'+list.map(x=>'<article class="review"><div class="review-head"><span>'+(x.user_id===state.user?.id?'You':'Reader')+' · '+(x.kind==='review'?'★ '+esc(x.rating)+'/10 · Review':'Comment')+'</span><span>'+esc(fmtDate(x.created_at))+'</span></div>'+(x.body?'<div class="review-body">'+esc(x.body)+'</div>':'')+(x.media_url?'<img loading="lazy" src="'+esc(img(x.media_url))+'" alt="'+(x.media_type==='gif'?'Attached GIF':'Attached image')+'">':'')+(x.user_id===state.user?.id?'<div style="text-align:right;margin-top:10px"><button class="chip" data-delete-post="'+esc(x.id)+'" data-kind="'+x.kind+'">Delete</button></div>':'')+'</article>').join('')+'</div>'}

try sections">'+tabs.map((x,i)=>'<button role="tab" aria-selected="'+(i===0)+'" class="entry-tab '+(i===0?'active':'')+'" data-tab="'+x[0]+'">'+x[1]+(x[0]==='community'?' ('+(state.reviews.length+state.comments.length)+')':'')+'</button>').join('')+'</div><section class="entry-tab-panel panel" id="tab-overview" role="tabpanel"><h2>Overview</h2><p class="overview">'+esc(t.synopsis||'No overview has been added yet.')+'</p><div id="entry-trailer"></div></section><section class="entry-tab-panel panel hidden" id="tab-characters" role="tabpanel"><h2>Characters</h2>'+chars+'</section><section class="entry-tab-panel panel hidden" id="tab-details" role="tabpanel"><h2>Details</h2>'+facts(t)+'</section><section id="tab-community" class="entry-tab-panel panel community hidden" role="tabpanel"><div class="community-top"><div><div class="eyebrow">Community</div><h2 style="margin:7px 0 0">Reviews & comments</h2><p class="muted small" style="margin-top:7px">Join the conversation about this entry.</p></div><span class="pill">'+(state.reviews.length+state.comments.length)+' posts</span></div>'+(state.user?'<form id="review-form" class="review-form"><label class="field">Your rating<select name="rating"><option value="10">10 — Masterpiece</option><option value="9">9 — Excellent</option><option value="8">8 — Great</option><option value="7">7 — Good</option><option value="6">6 — Fine</option><option value="5">5 — Average</option><option value="4">4 — Weak</option><option value="3">3 — Poor</option><option value="2">2 — Bad</option><option value="1">1 — Terrible</option></select></label><label class="field">Write a comment or review<textarea name="body" maxlength="3000" placeholder="Share theories, favourite moments, or recommendations…"></textarea></label><label class="field">Image or GIF (optional, max 8 MB)<input name="media" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><div class="admin-actions"><button class="btn primary" type="submit">Post comment</button>< k"><input type="hidden" name="id"><div class="admin-grid"><label class="field">Title name *<input name="name" required maxlength="200"></label><label class="field">Media type<select name="media_type"><option>Manga</option><option>Manhwa</option><option>Manhua</option><option>Anime</option><option>Light Novel</option><option>Web Novel</option></select></label><label class="field wide">Alternative names (comma separated)<input name="alternative_names"></label><label class="field">Cover image URL<input name="cover_url" type="url"></label><label class="field">Banner image URL<input name="banner_url" type="url"></label><label class="field wide">Synopsis<textarea name="synopsis" maxlength="10000"></textarea></label><label class="field">Genres (comma separated)<input name="genres"></label><label class="field">Themes (comma separated)<input name="themes"></label><label class="field">Status<select name="status"><option>Ongoing</option><option>Completed</option><option>Hiatus</option><option>Upcoming</option><option>Cancelled</option></select></label><label class="field">Release year<input name="release_year" type="number" min="1900" max="2100"></label><label class="field">Rating (0–10)<input name="rating" type="number" min="0" max="10" step=".1"></label><label class="field">Chapters<input name="chapters"></label><label class="field">Episodes<input name="episodes"></label><label class="field">Author<input name="author"></label><label class="field">Artist<input name="artist"></label><label class="field">Studio<input name="studio"></label><label class="field">Country<input name="country"></label><label class="field">Source URL<input name="source_url" type="url"></label><label class="field">AniList ID<input name="anilist_id" type="number" min="1"></label><label class="field">Character name (optional)<input name="character_name"></label><label class="field">Character image URL<input name="character_image" type="url"></label><label class="field">Character role<input name="character_role" placeholder="Main"></label><label class="field wide">Character description<input name="character_description"></label><label class="field"><span><input type="checkbox" name="is_featured"> Featured on hero</span></label><label class="field"><span><input type="checkbox" name="is_trending"> Trending</span></label></div><div class="admin-actions"><button class="btn primary" type="submit" id="admin-save">Save title</button><button class="btn" type="button" id="admin-clear">Clear form</button><button class="btn" type="button" id="anilist-fetch">Fetch AniList metadata</button></div><p id="admin-status" class="muted small"></p></form></div><section class="section">'+topTitle('Full catalogue','Edit every field, remove entries, or add a new title above')+'<label class="field" style="margin-bottom:14px">Filter catalogue<input class="input" id="admin-catalogue-search" placeholder="Search by title, type, author, genre…"></label><div class="library-list" id="admin-catalogue-list">'+state.titles.map(t=>'<div class="library-row"><img src="'+esc(img(t.cover_url))+'" alt=""><div class="grow"><strong>'+esc(titleName(t))+'</strong><div class="muted small">'+esc(media(t))+' · '+esc(t.status||'Ongoing')+'</div></div><button class="btn" type="button" data-edit-title="'+esc(t.id)+'">Edit</button><button class="btn" type="button" data-remove-title="'+esc(t.id)+'">Delete</button></div>').join('')+'</div></section></section>'}
const NEWS_FEEDS=[
{label:'Anime announcements',category:'Anime',url:'https://news.google.com/rss/search?q=anime+announcement+OR+anime+adaptation+OR+anime+sequel&hl=en-US&gl=US&ceid=US:en'},

];
const newsDate=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?'Recently published':d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})};
function newsCategory(item){const text=(item.title+' '+item.description+' '+item.source).toLowerCase();if(/manhwa|manga|manhua|webtoon|comic|chapter|volume|mangaka|publisher/.test(text))return 'Manga & Manhwa';if(/author|artist|creator|interview|publisher|editor|studio|industry/.test(text))return 'Creators & Industry';return 'Anime'}
function newsPage(){const items=state.news.filter(x=>state.newsFilter==='All'||x.category===state.newsFilter);const filters=['All','Anime','Manga & Manhwa','Creators & Industry'];return '<section class="news-hero"><div class="eyebrow">7MANGA · LIVE CULTURE DESK</div><h1>Stay in the loop.</h1><p>Fresh anime announcements, manga and manhwa updates, creator stories, and upcoming release dates gathered from external publishers and news feeds. New stories appear as sources publish them.</p><div class="news-meta"><span class="news-tag"><span class="nav-live-dot"></span> Live feed</span><span id="news-last-updated">'+(state.newsUpdatedAt?'Updated '+esc(newsDate(state.newsUpdatedAt)):'Feed not refreshed yet')+'</span><span>External sources · links open original stories</span></div><div style="margin-top:18px"><button class="btn primary" id="news-refresh" '+(state.newsLoading?'disabled':'')+'>'+(state.newsLoading?'Refreshing…':'↻ Refresh news')+'</button></div></section><section class="section"><div class="news-controls"><div><h2>Latest updates</h2><p class="muted small" style="margin:6px 0 0">Sorted by publication time · not every source updates continuously</p></div><div class="news-filters">'+filters.map(x=>'<button class="chip '+(state.newsFilter===x?'active':'')+'" data-news-filter="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div></div>'+(state.newsLoading&&!state.news.length?'<div class="news-state">Fetching the latest stories from news feeds…</div>':items.length?'<div class="news-grid">'+items.map(x=>'<article class="news-card"><div class="news-meta"><span class="news-tag">'+esc(x.category)+'</span><span>'+esc(newsDate(x.date))+'</span></div><h3>'+esc(x.title)+'</h3><p>'+esc(x.description||'Open the original source for the full announcement and details.')+'</p><div class="news-bottom"><span class="muted small">'+esc(x.source||'News source')+'</span><a href="'+esc(safeUrl(x.link))+'" target="_blank" rel="noopener noreferrer">Read story ↗</a></div></article>').join('')+'</div>':'<div class="news-state">'+(state.newsLoaded?'No stories available for this filter right now. Try All or refresh the feed.':'News has not loaded yet. Tap Refresh news to fetch the latest available stories.')+'</div>')+'</section><section class="section"><div class="section-head"><div><h2>Upcoming release dates</h2><p class="muted small">Dates reported by AniList; availability may vary by region.</p></div><button class="btn" id="release-refresh">↻ Update dates</button></div>'+(state.releases.length?'<div class="release-list">'+state.releases.map(x=>'<article class="release-row"><div class="release-date"><strong>'+esc(x.day)+'</strong><span>'+esc(x.month)+'</span></div><div class="grow"><h3>'+esc(x.title)+'</h3><p>'+esc(x.type)+' · '+esc(x.dateLabel)+(x.confirmed?' · Confirmed date':' · Announced date')+'</p></div><a class="btn" href="'+esc(safeUrl(x.url))+'" target="_blank" rel="noopener">Details ↗</a></article>').join('')+'</div>':'<div class="news-state" id="release-status">Loading announced anime and manga dates…</div>')+'</section><section class="section"><div class="section-head"><div><h2>Follow the sources</h2><p class="muted small">Official publisher pages and independent reporting.</p></div></div><div class="news-sources"><a href="https://www.animenewsnetwork.com/" target="_blank" rel="noopener">Anime News Network ↗</a><a href="https://www.viz.com/press-releases" target="_blank" rel="noopener">VIZ Press Releases ↗</a><a href="https://kodansha.us/news/" target="_blank" rel="noopener">Kodansha News ↗</a><a href="https://www.shonenjump.com/j/media/" target="_blank" rel="noopener">Shonen Jump Official ↗</a><a href="https://anilist.co/search/anime" target="_blank" rel="noopener">AniList ↗</a></div></section>'}
async function fetchNews(){if(state.newsLoading)return;state.newsLoading=true;render();const queries=NEWS_FEEDS.slice(0,3);const all=[];const proxy=url=>'https://api.allorigins.win/raw?url='+encodeURIComponent(url);const parseFeed=(xml,source)=>{const doc=new DOMParser().parseFromString(xml,'text/xml');if(doc.querySelector('parsererror'))return;doc.querySelectorAll('item,entry').forEach(n=>{const title=n.querySelector('title')?.textContent?.trim()||'';const linkNode=n.querySelector('link');const link=linkNode?.getAttribute('href')||linkNode?.textContent?.trim()||'';const date=n.querySelector('pubDate,published,updated,dc\\:date')?.textContent||'';const desc=(n.querySelector('description,summary,content\\:encoded')?.textContent||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();if(!title||!safeUrl(link))return;const parsed=new Date(date);if(date&&!Number.isNaN(parsed.getTime())&&Date.now()-parsed.getTime()>14*86400000)return;all.push({title,link,date:date&&!Number.isNaN(parsed.getTime())?parsed.toISOString():new Date().toISOString(),description:desc.slice(0,260),source,category:newsCategory({title,description:desc,source})})})};await Promise.all(queries.map(async f=>{try{const res=await fetch(proxy(f.url),{signal:AbortSignal.timeout(10000)});if(!res.ok)throw Error('feed unavailable');parseFeed(await res.text(),f.label)}catch(e){console.warn('News feed unavailable:',f.label,e.message)}}));const dedup=new Map();all.sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(x=>{const key=x.title.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,110);if(!dedup.has(key))dedup.set(key,x)});state.news=[...dedup.values()].slice(0,60);state.newsLoaded=true;state.newsLoading=false;state.newsUpdatedAt=new Date().toISOString();if(!state.news.length)notify('News feeds could not be reached. Try again in a moment.');render()}
async function fetchReleases(){if(state.releaseLoading)return;state.releaseLoading=true;const box=document.getElementById('release-status');if(box)box.textContent='Checking announced release dates…';try{const query='query { Page(page:1,perPage:30){ media(type:ANIME,status:NOT_YET_RELEASED,sort:START_DATE){ id title{english romaji} startDate{year month day} format status siteUrl } } }';const res=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query})});if(!res.ok)throw Error('Release calendar is temporarily unavailable');const json=await res.json();const anime=(json.data?.Page?.media||[]).filter(x=>x.startDate?.year&&x.startDate?.month&&x.startDate?.day).map(x=>{const d=x.startDate;const date=new Date(Date.UTC(d.year,d.month-1,d.day));return {title:x.title?.english||x.title?.romaji||'Untitled',type:x.format||'Anime',url:x.siteUrl||'https://anilist.co/search/anime',date:date.toISOString(),dateLabel:date.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}),day:String(d.day).padStart(2,'0'),month:date.toLocaleDateString(undefined,{month:'short',timeZone:'UTC'}),confirmed:true}});const mq='query { Page(page:1,perPage:15){ media(type:MANGA,status:NOT_YET_RELEASED,sort:START_DATE){ id title{english romaji} startDate{year month day} format status siteUrl } } }';const mr=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query:mq})});if(mr.ok){const mj=await mr.json();(mj.data?.Page?.media||[]).filter(x=>x.startDate?.year&&x.startDate?.month&&x.startDate?.day).forEach(x=>{const d=x.startDate,date=new Date(Date.UTC(d.year,d.month-1,d.day));anime.push({title:x.title?.english||x.title?.romaji||'Untitled',type:x.format||'Manga',url:x.siteUrl||'https://anilist.co/search/manga',date:date.toISOString(),dateLabel:date.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}),day:String(d.day).padStart(2,'0'),month:date.toLocaleDateString(undefined,{month:'short',timeZone:'UTC'}),confirmed:true})})}state.releases=anime.sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,25);state.releaseLoading=false;render()}catch(e){state.releaseLoading=false;console.error('Release dates unavailable',e);if(box)box.textContent='Could not load dates right now. Please try Update dates again.'}}
function render(preserveScroll=false){const savedScroll=preserveScroll?(window.scrollY||window.pageYOffset):0;clearInterval(carouselTimer);carouselTimer=null;applyFilters();let route=location.hash.replace(/^#/, '')||'/';state.route=route;if(route==='/news'){if(!state.newsLoaded&&!state.newsLoading)setTimeout(fetchNews,0);if(!state.releases.length&&!state.releaseLoading)setTimeout(fetchReleases,0)}if(route.startsWith('/title/')){const id=route.slice(7),t=state.titles.find(x=>x.id===id);if(!t){app.innerHTML='<div class="empty">Loading entry…</div>';return}state.selected=t;app.innerHTML=entry(t)}else if(route==='/news')app.innerHTML=newsPage();else if(route==='/browse')app.innerHTML=browse();else if(route==='/library')app.innerHTML=library();else if(route==='/account')app.innerHTML=state.admin?adminPage():authPage();else if(route==='/admin')app.innerHTML=adminPage();else if(route==='/about')app.innerHTML='<section class="section panel"><div class="eyebrow">About</div><h1>Stories beyond worlds.</h1><p class="overview">7MANGA is a community catalogue for manga, manhwa, manhua, anime and more. Discover stories, save favourites, and share your thoughts with other readers.</p></section>';else app.innerHTML=home();bindPage();if(route==='/'&&state.titles.length>1){carouselTimer=setInterval(()=>{if(document.hidden||state.route!=='/')return;state.slide=(state.slide+1)%Math.min(6,state.titles.length);render(true)},3000)}if(preserveScroll)window.scrollTo({top:savedScroll,behavior:'instant'});else window.scrollTo({top:0,behavior:'instant'})}
function bindPage(){const newsRefresh=document.getElementById('news-refresh');if(newsRefresh)newsRefresh.onclick=fetchNews;const releaseRefresh=document.getElementById('release-refresh');if(releaseRefresh)releaseRefresh.onclick=fetchReleases;app.querySelectorAll('[data-news-filter]').forEach(b=>b.onclick=()=>{state.newsFilter=b.dataset.newsFilter;render()});const addNew=document.getElementById('admin-add-new');if(addNew)addNew.onclick=()=>{const form=document.getElementById('admin-form');if(!form)return;form.reset();form.elements.id.value='';window.pendingAniCharacters=[];document.getElementById('anilist-results').innerHTML='';form.querySelector('#admin-status').textContent='New entry ready. Fill in the details and save.';form.scrollIntoView({behavior:'smooth',block:'start'});form.elements.name.focus()};const adminSignout=document.getElementById('admin-signout');if(adminSignout)adminSignout.onclick=async()=>{await db.auth.signOut();await refreshUser();location.hash='#/';render();notify('Signed out')};const catalogueSearch=document.getElementById('admin-catalogue-search');if(catalogueSearch)catalogueSearch.oninput=()=>{const q=catalogueSearch.value.toLowerCase().trim();document.querySelectorAll('#admin-catalogue-list .library-row').forEach(row=>row.classList.toggle('hidden',!row.textContent.toLowerCase().includes(q)))};const recheck=document.getElementById('admin-recheck');if(recheck)recheck.onclick=async()=>{recheck.disabled=true;recheck.textContent='Checking…';const result=await refreshUser();render();if(result.admin)notify('Admin access confirmed');else notify(result.adminError||'This signed-in user ID is not listed in admin_users')};app.querySelectorAll('[data-open]').forEach(el=>{const open=()=>openTitle(el.dataset.open);el.addEventListener('click',e=>{if(e.target.closest('button[data-save]'))return;open()});el.addEventListener('keydown',e=>{if(e.key==='Enter')open()})});app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});app.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{state.slide=Number(b.dataset.slide);render()});app.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveTitle(b.dataset.save));app.querySelectorAll('[data-auth-open]').forEach(b=>b.onclick=()=>location.hash='#/account');app.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{if(history.state?.route)history.back();else location.hash='#/browse'});app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const key=b.dataset.tab;app.querySelectorAll('.entry-tab').forEach(x=>{x.classList.toggle('active',x.dataset.tab===key);x.setAttribute('aria-selected',String(x.dataset.tab===key))});app.querySelectorAll('.entry-tab-panel').forEach(x=>x.classList.toggle('hidden',x.id!=='tab-'+key));});app.querySelectorAll('[data-delete-post]').forEach(b=>b.onclick=()=>deletePost(b.dataset.deletePost,b.dataset.kind));const af=document.getElementById('auth-form');if(af)bindAuth(af);const rf=document.getElementById('review-form');if(rf)rf.onsubmit=submitReview;const admin=document.getElementById('admin-form');if(admin)bindAdmin(admin)}
async function saveTitle(id){if(!state.user){location.hash='#/account';return notify('Sign in to save titles.')}if(state.library.has(id)){const {error}=await db.from('user_library').delete().eq('user_id',state.user.id).eq('title_id',id);if(error)return notify(error.message);state.library.delete(id);notify('Removed from your library')}else{const {error}=await db.from('user_library').upsert({user_id:state.user.id,title_id:id},{onConflict:'user_id,title_id'});if(error)return notify(error.message);state.library.add(id);notify('Saved to your library')}render()}
async function submitReview(e){e.preventDefault();if(!state.user)return notify('Sign in to comment');const form=e.currentTarget,t=state.selected,status=form.querySelector('#review-status'),body=form.elements.body.value.trim(),file=form.elements.media.files[0],rating=Number(form.elements.rating.value);if(!body&&!file){status.textContent='Write a comment or attach an image.';return}if(file&&(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)||file.size>8*1024*1024)){status.textContent='Choose a JPEG, PNG, WEBP or GIF under 8 MB.';return}const button=form.querySelector('button[type=submit]');button.disabled=true;status.textContent='Posting…';try{let media_url=null,media_type=null;if(file){const ext=(file.name.split('.').pop()||'img').toLowerCase().replace(/[^a-z0-9]/g,'');const path=state.user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const up=await db.storage.from('community-media').upload(path,file,{contentType:file.type});if(up.error)throw up.error;media_url=db.storage.from('community-media').getPublicUrl(path).data.publicUrl;media_type=file.type==='image/gif'?'gif':'image'}if(body){const ins=await db.from('community_comments').insert({title_id:t.id,user_id:state.user.id,body,media_url,media_type});if(ins.error)throw ins.error;if(rating){const {data:existing}=await db.from('title_reviews').select('id').eq('title_id',t.id).eq('user_id',state.user.id).maybeSingle();const payload={rating,review:body,updated_at:new Date().toISOString()};const res=existing?await db.from('title_reviews').update(payload).eq('id',existing.id):await db.from('title_reviews').insert({title_id:t.id,user_id:state.user.id,...payload});if(res.error)console.warn('Rating review could not be saved:',res.error.message)}}else{const ins=await db.from('community_comments').insert({title_id:t.id,user_id:state.user.id,body:'',media_url,media_type});if(ins.error)throw ins.error}form.reset();await loadEntryExtras(t.id);render();document.getElementById('entry-community')?.scrollIntoView({behavior:'smooth'});notify('Your comment was posted')}catch(err){status.textContent=err.message||'Unable to post. Try again.'}finally{button.disabled=false}}
async function deletePost(id,kind){if(!confirm('Delete this post?'))return;const table=kind==='review'?'title_reviews':'community_comments';const {error}=await db.from(table).delete().eq('id',id).eq('user_id',state.user?.id);if(error)return notify(error.message);await loadEntryExtras(state.selected.id);render();notify('Post deleted')}
function bindAuth(form){form.onsubmit=async e=>{e.preventDefault();const status=form.querySelector('#auth-status');status.textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:form.elements.email.value.trim(),password:form.elements.password.value});status.textContent=error?error.message:'Signed in.';if(!error){await refreshUser();render();notify('Signed in')}};document.getElementById('signup-btn').onclick=async()=>{const email=form.elements.email.value.trim(),password=form.elements.password.value;if(!email||password.length<6){form.querySelector('#auth-status').textContent='Enter email and password (at least 6 characters).';return}const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});form.querySelector('#auth-status').textContent=error?error.message:(data.session?'Account created.':'Check your email to confirm your account, then sign in.');};document.getElementById('reset-btn').onclick=async()=>{const email=form.elements.email.value.trim();if(!email){form.querySelector('#auth-status').textContent='Enter your email first.';return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+'#/account'});form.querySelector('#auth-status').textContent=error?error.message:'Password reset email sent if that account exists.'};document.getElementById('signout-btn')?.addEventListener('click',async()=>{await db.auth.signOut();await refreshUser();location.hash='#/';render()})}
function bindAdmin(form){app.querySelectorAll('[data-edit-title]').forEach(b=>b.onclick=()=>loadAdminTitle(b.dataset.editTitle,form));app.querySelectorAll('[data-remove-title]').forEach(b=>b.onclick=()=>removeAdminTitle(b.dataset.removeTitle));const searchBtn=document.getElementById('anilist-search');if(searchBtn)searchBtn.onclick=()=>searchAniList(form);form.onsubmit=async e=>{e.preventDefault();if(!state.admin)return notify('Admin access required');const f=form.elements,st=form.querySelector('#admin-status'),id=f.id.value;const data={name:f.name.value.trim(),media_type:f.media_type.value,alternative_names:f.alternative_names.value.split(',').map(x=>x.trim()).filter(Boolean),cover_url:f.cover_url.value.trim(),banner_url:f.banner_url.value.trim(),synopsis:f.synopsis.value.trim(),genres:f.genres.value.split(',').map(x=>x.trim()).filter(Boolean),themes:f.themes.value.split(',').map(x=>x.trim()).filter(Boolean),status:f.status.value,release_year:f.release_year.value?Number(f.release_year.value):null,rating:f.rating.value?Number(f.rating.value):null,chapters:f.chapters.value||null,episodes:f.episodes.value||null,author:f.author.value||null,artist:f.artist.value||null,studio:f.studio.value||null,country:f.country.value||null,source_url:f.source_url.value||null,anilist_id:f.anilist_id.value?Number(f.anilist_id.value):null,is_featured:f.is_featured.checked,is_trending:f.is_trending.checked,updated_at:new Date().toISOString()};st.textContent='Saving…';const res=id?await db.from('titles').update(data).eq('id',id).select('id').single():await db.from('titles').insert(data).select('id').single();if(res.error){st.textContent='Save failed ('+res.error.code+'): '+res.error.message+(res.error.code==='42501'?' — Supabase admin policy denied this account. Sign in with the admin email and verify public.admin_users.':'');notify(st.textContent);return}if(!res.data?.id){st.textContent='Supabase did not return a saved title ID. Check the insert policy and permissions.';return}const charName=f.character_name.value.trim();const chars=[...(window.pendingAniCharacters||[])];if(charName)chars.unshift({name:charName,role:f.character_role.value||'Supporting',image_url:f.character_image.value||'',description:f.character_description.value||''});if(chars.length){const existing=await db.from('characters').delete().eq('title_id',res.data.id);if(existing.error)console.warn('Could not replace old character metadata:',existing.error.message);const ch=await db.from('characters').insert(chars.map(c=>({title_id:res.data.id,name:c.name,role:c.role||'Supporting',image_url:c.image_url||'',description:c.description||''})));if(ch.error)st.textContent='Title saved, but character import failed: '+ch.error.message;else{st.textContent='Title and '+chars.length+' character(s) saved.';window.pendingAniCharacters=[]}}else st.textContent='Title saved.';await loadTitles();render();if(location.hash!=='#/admin')location.hash='#/admin';notify(id?'Entry updated successfully':'New entry added successfully')};document.getElementById('admin-clear').onclick=()=>{form.reset();form.elements.id.value='';form.querySelector('#admin-status').textContent='New entry ready.';window.pendingAniCharacters=[];document.getElementById('anilist-results').innerHTML=''};document.getElementById('anilist-fetch').onclick=()=>fetchAniList(form)}
async function loadAdminTitle(id,form){const t=state.titles.find(x=>x.id===id);if(!t)return;const f=form.elements;f.id.value=t.id;for(const k of ['name','media_type','cover_url','banner_url','synopsis','status','release_year','rating','chapters','episodes','author','artist','studio','country','source_url','anilist_id'])if(f[k])f[k].value=t[k]??'';for(const k of ['alternative_names','genres','themes'])if(f[k])f[k].value=(t[k]||[]).join(', ');f.is_featured.checked=!!t.is_featured;f.is_trending.checked=!!t.is_trending;const {data}=await db.from('characters').select('*').eq('title_id',id).order('created_at',{ascending:false}).limit(60);window.pendingAniCharacters=(data||[]).map(c=>({name:c.name,role:c.role,image_url:c.image_url,description:c.description}));form.querySelector('#admin-status').textContent='Editing “'+t.name+'”. Save changes when ready.';form.scrollIntoView({behavior:'smooth',block:'start'});}
async function removeAdminTitle(id){if(!state.admin||!confirm('Delete this title and its catalogue entry?'))return;const {error}=await db.from('titles').delete().eq('id',id);if(error)return notify('Delete failed: '+error.message);await loadTitles();render();notify('Title deleted')}
async function searchAniList(form){const q=document.getElementById('anilist-query').value.trim();const box=document.getElementById('anilist-results');if(!q)return notify('Enter a title or AniList ID.');box.innerHTML='<div class="loading">Searching AniList…</div>';const n=Number(q);if(Number.isInteger(n)&&n>0){form.elements.anilist_id.value=n;await fetchAniList(form);box.innerHTML='<div class="muted small">Fetched AniList ID '+n+'. Review the form below and save.</div>';return}const query='query ($search:String,$type:MediaType){Page(page:1,perPage:12){media(search:$search,type:$type,sort:SEARCH_MATCH){id type title{romaji english native} format status startDate{year} coverImage{large extraLarge} bannerImage description(asHtml:false) genres averageScore chapters episodes countryOfOrigin}}}';try{const response=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables:{search:q,type:form.elements.media_type.value==='Anime'?'ANIME':'MANGA'}})});const payload=await response.json();if(!response.ok)throw Error(payload.errors?.[0]?.message||'AniList search request failed');const rows=payload.data?.Page?.media||[];if(!rows.length){box.innerHTML='<div class="empty">No AniList results found. Try another title.</div>';return}box.innerHTML=rows.map(m=>'<div class="library-row"><img src="'+esc(m.coverImage?.large||'')+'" alt=""><div class="grow"><strong>'+esc(m.title?.english||m.title?.romaji||m.title?.native||'Untitled')+'</strong><div class="muted small">'+esc(m.type==='ANIME'?'ANIME':'MANGA')+' · '+esc(m.format||'FORMAT UNKNOWN')+' · '+esc(m.startDate?.year||'Year unknown')+' · AniList #'+m.id+'</div><div class="muted small">'+esc((m.genres||[]).slice(0,4).join(' · '))+'</div></div><button class="btn primary" type="button" data-import-anilist="'+m.id+'">Use entry</button></div>').join('');box.querySelectorAll('[data-import-anilist]').forEach(b=>b.onclick=async()=>{form.elements.anilist_id.value=b.dataset.importAnilist;await fetchAniList(form);box.innerHTML='<div class="muted small">Metadata loaded into the form. Review title, cover and banner links, then save.</div>';form.scrollIntoView({behavior:'smooth',block:'start'})})}catch(e){box.innerHTML='<div class="empty">AniList search failed: '+esc(e.message)+'</div>'}}
async function fetchAniList(form){const id=Number(form.elements.anilist_id.value);if(!id){notify('Enter an AniList ID first.');return}const status=form.querySelector('#admin-status');status.textContent='Fetching AniList metadata…';const query='query ($id:Int){Media(id:$id){id title{romaji english native} synonyms description(asHtml:false) type format status startDate{year} averageScore popularity genres tags{name} coverImage{extraLarge large} bannerImage season seasonYear chapters episodes countryOfOrigin siteUrl staff(perPage:20,sort:RELEVANCE){edges{role node{name{full}}}} studios(isMain:true){nodes{name}} characters(perPage:30,sort:ROLE){edges{role node{name{full} image{large} description(asHtml:false)}}}}}';try{const res=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables:{id}})});const json=await res.json();const m=json.data?.Media;if(!m)throw Error(json.errors?.[0]?.message||'No AniList title found');const f=form.elements;f.name.value=m.title.english||m.title.romaji||m.title.native||'';f.alternative_names.value=[m.title.romaji,m.title.native].filter(Boolean).filter(x=>x!==f.name.value).join(', ');f.synopsis.value=(m.description||'').replace(/<[^>]*>/g,'');f.genres.value=(m.genres||[]).join(', ');f.status.value=({'RELEASING':'Ongoing','FINISHED':'Completed','NOT_YET_RELEASED':'Upcoming','CANCELLED':'Cancelled','HIATUS':'Hiatus'})[m.status]||'Ongoing';f.release_year.value=m.startDate?.year||m.seasonYear||'';f.rating.value=m.averageScore?Math.round(m.averageScore/10*10)/10:'';f.chapters.value=m.chapters||'';f.episodes.value=m.episodes||'';f.country.value=m.countryOfOrigin||'';f.anilist_id.value=m.id;if(!f.cover_url.value.trim())f.cover_url.value=m.coverImage?.extraLarge||m.coverImage?.large||'';if(!f.banner_url.value.trim())f.banner_url.value=m.bannerImage||'';if(!f.source_url.value.trim())f.source_url.value=m.siteUrl||('https://anilist.co/'+(m.type==='ANIME'?'anime':'manga')+'/'+m.id);const staff=m.staff?.edges||[];if(!f.author.value.trim())f.author.value=staff.find(x=>/story|original creator|writer/i.test(x.role))?.node?.name?.full||'';if(!f.artist.value.trim())f.artist.value=staff.find(x=>/art|illustration|artist/i.test(x.role))?.node?.name?.full||'';if(!f.studio.value.trim())f.studio.value=(m.studios?.nodes||[]).map(x=>x.name).join(', ');if(!f.themes.value.trim())f.themes.value=(m.tags||[]).filter(x=>x.name).map(x=>x.name).slice(0,20).join(', ');window.pendingAniCharacters=(m.characters?.edges||[]).map(x=>({name:x.node.name.full,role:x.role||'Supporting',image_url:x.node.image?.large||'',description:x.node.description||''}));status.textContent='AniList metadata loaded. Check/edit the name, cover URL and banner URL, then Save title. '+window.pendingAniCharacters.length+' characters fetched.'}catch(e){status.textContent='AniList fetch failed: '+e.message}}
document.getElementById('global-search').addEventListener('input',e=>{state.search=e.target.value;applyFilters();if(!['/title/','/account','/admin','/news'].some(x=>state.route.startsWith(x))){if(state.route==='/')render();else if(state.route==='/browse')render()}});
document.getElementById('account-btn').onclick=()=>{location.hash='#/account'};document.getElementById('mobile-account').onclick=()=>{location.hash='#/account'};document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>location.hash=b.dataset.route);document.getElementById('year').textContent=new Date().getFullYear();
