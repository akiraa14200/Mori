<script>
(()=>{'use strict';
const cfg=window.APP_CONFIG||{},app=document.getElementById('app'),toastNode=document.getElementById('toast');
if(!window.supabase||!cfg.supabaseUrl||!cfg.supabaseKey){app.innerHTML='<div class="empty">Site configuration is missing. Check config.js and the Supabase client.</div>';return}

const state={titles:[],filtered:[],titleIndex:[],recentTitles:[],trendingTitles:[],heroTitles:[],user:null,admin:false,route:'/',selected:null,characters:[],library:new Set(),reviews:[],comments:[],slide:0,filter:'All',search:'',browsePage:1,browsePageSize:24,loading:false,settings:{},profiles:{},profile:null,news:[],newsLoaded:false,newsLoading:false,newsFilter:'All',releases:[],releaseLoading:false,newsUpdatedAt:null,commentSort:'newest',commentLikes:{},replyingTo:null};
let carouselTimer=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>{try{const u=new URL(v,location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};

function notify(msg){toastNode.textContent=msg;toastNode.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toastNode.classList.add('hidden'),3200)}
function titleName(t){return t?.name||t?.title||'Untitled'}

async function loadTitles(){const {data,error}=await db.from('titles').select('*').order('created_at',{ascending:false}).limit(1000);if(error){console.error(error);notify('Could not load catalogue: '+error.message);return}state.titles=data||[];state.titleIndex=state.titles.map(t=>({t,names:[titleName(t),...(t.alternative_names||[])].filter(Boolean),text:[t.name,...(t.alternative_names||[]),t.synopsis,...(t.genres||[])].filter(Boolean).join(' ').toLocaleLowerCase(),genreText:(t.genres||[]).join(' ').toLocaleLowerCase()}));state.recentTitles=state.titles.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));state.trendingTitles=state.titles.filter(t=>t.is_trending).slice().sort((a,b)=>Number(b.popularity||0)-Number(a.popularity||0));state.heroTitles=state.titles.slice().sort((a,b)=>Number(!!b.is_featured)-Number(!!a.is_featured)||Number(!!b.is_trending)-Number(!!a.is_trending)||new Date(b.created_at)-new Date(a.created_at));applyFilters()}
function applyFilters(){const q=state.search.toLocaleLowerCase().trim();const source=state.titleIndex.length?state.titleIndex:state.titles.map(t=>({t,text:[t.name,...(t.alternative_names||[]),t.synopsis,...(t.genres||[])].filter(Boolean).join(' ').toLocaleLowerCase()}));state.filtered=source.filter(x=>(!q||x.text.includes(q))&&(state.filter==='All'||media(x.t)===state.filter)).map(x=>x.t)}
async function refreshUser(){const {data,error:userError}=await db.auth.getUser();if(userError)console.warn('Could not read auth user',userError.message);state.user=data?.user||null;state.admin=false;state.library.clear();state.adminCheckError='';if(state.user){const [a,l]=await Promise.all([db.from('admin_users').select('user_id').eq('user_id',state.user.id).maybeSingle(),db.from('user_library').select('title_id').eq('user_id',state.user.id)]);state.adminCheckError=a.error?.message||'';state.admin=!!a.data&&!a.error;(l.data||[]).forEach(x=>state.library.add(x.title_id))}document.getElementById('account-btn').textContent=state.user?(state.user.email?.split('@')[0]||'Account'):'Sign in';return {user:state.user,admin:state.admin,adminError:state.adminCheckError}}
function hero(){const list=state.heroTitles.length?state.heroTitles:state.titles;if(!list.length)return '<section class="hero"><div class="hero-copy"><div class="eyebrow">Welcome to 7MANGA</div><h1>Stories beyond worlds.</h1><p>Your next obsession starts here. Browse the catalogue and find a world worth getting lost in.</p><a class="btn primary" href="#/browse">Explore catalogue ↗</a></div></section>';const t=list[state.slide%list.length];return '<section class="hero"><img class="hero-art" src="'+esc(img(t.banner_url||t.cover_url))+'" alt="" onerror="this.style.display=\'none\'"><div class="hero-copy"><div class="eyebrow">'+(t.is_featured?'✦ Featured story':'✦ Discover something new')+'</div><h1>'+esc(titleName(t))+'</h1><div class="pills"><span class="pill">'+esc(media(t))+'</span><span class="pill">★ '+esc(Number(t.rating||0).toFixed(1))+'</span><span class="pill">'+esc(t.status||'Ongoing')+'</span></div><div class="hero-actions"><button class="btn primary" data-open="'+esc(t.id)+'">Explore title ↗</button><button class="btn" data-save="'+esc(t.id)+'">'+(state.library.has(t.id)?'♥ In library':'♡ Add to library')+'</button></div><div class="dots">'+list.slice(0,6).map((_,i)=>'<button aria-label="Slide '+(i+1)+'" class="dot '+(i===state.slide%Math.min(6,list.length)?'active':'')+'" data-slide="'+i+'"></button>').join('')+'</div></div></section>'}
function recommendedTitles(){const saved=state.titles.filter(t=>state.library.has(t.id));const likedTerms=new Set(saved.flatMap(t=>[...(t.genres||[]),...(t.themes||[]),media(t)]).map(x=>String(x).toLowerCase()));const candidates=state.titles.filter(t=>!state.library.has(t.id));const ranked=candidates.map(t=>({t,score:[...(t.genres||[]),...(t.themes||[]),media(t)].reduce((n,x)=>n+(likedTerms.has(String(x).toLowerCase())?3:0),0)+Number(t.rating||0)*0.35+Number(t.popularity||0)*0.002})).sort((a,b)=>b.score-a.score||new Date(b.t.created_at)-new Date(a.t.created_at));return ranked.slice(0,8).map(x=>x.t)}
function home(){const titles=state.filtered;const recs=recommendedTitles();const personalized=state.library.size>0;return hero()+'<section class="section">'+topTitle(personalized?'Picked for your taste':'Popular picks','Recommendations refresh from your saved titles and catalogue metadata')+grid(recs)+'</section><section class="section">'+topTitle('Made for your next binge','Freshly added to the 7MANGA catalogue')+grid(state.recentTitles.slice(0,12))+'</section><section class="section">'+topTitle('Trending now','Stories readers are checking out')+grid(state.trendingTitles.slice(0,12))+'</section><section class="section">'+topTitle('Explore the catalogue','Find your next favourite')+filters()+grid(titles.slice(0,18))+(titles.length>18?'<div style="text-align:center;margin-top:22px"><a class="btn" href="#/browse">View all titles →</a></div>':'')+'</section>'}
function filters(){const types=['All','Manga','Manhwa','Manhua','Anime','Light Novel','Web Novel'];return '<div class="filters">'+types.map(x=>'<button class="chip '+(state.filter===x?'active':'')+'" data-filter="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>'}
function browse(){const total=state.filtered.length;const pages=Math.max(1,Math.ceil(total/state.browsePageSize));state.browsePage=Math.min(Math.max(1,state.browsePage),pages);const start=(state.browsePage-1)*state.browsePageSize;const shown=state.filtered.slice(start,start+state.browsePageSize);const pager=pages>1?'<div class="browse-pagination" aria-label="Catalogue pages"><button class="btn" data-browse-page="prev" '+(state.browsePage===1?'disabled':'')+'>← Previous</button><span>Page <strong>'+state.browsePage+'</strong> of '+pages+' <i>·</i> '+total+' titles</span><button class="btn" data-browse-page="next" '+(state.browsePage===pages?'disabled':'')+'>Next →</button></div>':'';return '<section class="section browse-section">'+topTitle('Explore stories','Search by title, genre, or alternative name')+'<div class="browse-result-line"><span>'+total+' titles found</span><span>Showing '+(total?start+1:0)+'–'+Math.min(start+shown.length,total)+'</span></div>'+filters()+grid(shown)+pager+'</section>'}
function facts(t){const pairs=[['Type',media(t)],['Status',t.status],['Release',t.release_year],['Chapters',t.chapters],['Episodes',t.episodes],['Author',t.author],['Artist',t.artist],['Studio',t.studio],['Country',t.country],['Season',t.season],['Source',t.source_url?'<a target="_blank" rel="noopener" href="'+esc(img(t.source_url))+'">Open source ↗</a>':'—']];return '<div class="facts">'+pairs.filter(([k,v])=>v).map(([k,v])=>'<div class="fact"><label>'+esc(k)+'</label><strong>'+(k==='Source'?v:esc(v))+'</strong></div>').join('')+'</div>'}
async function openTitle(id){const t=state.titles.find(x=>x.id===id);if(!t)return notify('This title is no longer available.');state.selected=t;state.route='/title/'+id;history.pushState({route:state.route},'', '#'+state.route);await loadEntryExtras(id);render();loadEntryTrailer(t)}
function trailerEmbedUrl(url){try{const u=new URL(url);const rawHost=u.hostname.toLowerCase();const host=rawHost.startsWith('www.')?rawHost.slice(4):rawHost;const parts=u.pathname.split('/').filter(Boolean);let id='';if(host==='youtu.be'){id=parts[0]||'';return id?'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id):''}if(host==='youtube.com'||host==='m.youtube.com'||host==='youtube-nocookie.com'){if(u.pathname==='/watch')id=u.searchParams.get('v')||'';else if(['embed','shorts','live'].includes(parts[0]))id=parts[1]||'';return id?'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id):''}if(host==='dailymotion.com'){id=parts[0]==='video'?(parts[1]||'').split('_')[0]:'';return id?'https://www.dailymotion.com/embed/video/'+encodeURIComponent(id):''}if(host==='dai.ly'){id=parts[0]||'';return id?'https://www.dailymotion.com/embed/video/'+encodeURIComponent(id):''}}catch(error){}return ''}
async function loadEntryTrailer(t){const box=document.getElementById('entry-trailer');if(!box)return;box.innerHTML='';const showTrailer=url=>{const embed=trailerEmbedUrl(url);if(!embed)return false;const current=document.getElementById('entry-trailer');if(!current||state.selected?.id!==t.id)return false;current.innerHTML='<div style="margin-top:24px"><h3 style="font-size:17px;margin:0 0 12px">Trailer</h3><div style="position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:15px;border:1px solid var(--line);background:#08080b"><iframe src="'+esc(embed)+'" title="'+esc(titleName(t))+' trailer" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div></div>';return true};if(t?.trailer_url&&showTrailer(t.trailer_url))return;if(!t?.anilist_id)return;try{const query='query ($id:Int){Media(id:$id){trailer{id site}}}';const res=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables:{id:Number(t.anilist_id)}})});if(!res.ok)return;const json=await res.json();const trailer=json.data?.Media?.trailer;if(!trailer?.id)return;const site=String(trailer.site||'').toLowerCase();const trailerUrl=site==='youtube'?'https://www.youtube.com/watch?v='+trailer.id:site==='dailymotion'?'https://www.dailymotion.com/video/'+trailer.id:'';if(trailerUrl)showTrailer(trailerUrl)}catch(error){console.warn('Trailer lookup failed',error)}}
async function loadEntryExtras(id){const [ch,co]=await Promise.all([db.from('characters').select('*').eq('title_id',id).order('created_at',{ascending:false}).limit(60),db.from('community_comments').select('id,user_id,body,media_url,media_type,created_at,parent_comment_id').eq('title_id',id).order('created_at',{ascending:false}).limit(50)]);state.characters=ch.data||[];state.reviews=[];state.comments=co.data||[];state.commentLikes={};const commentIds=state.comments.map(x=>x.id);if(commentIds.length){const {data:likes,error:likeError}=await db.from('community_comment_likes').select('comment_id,user_id').in('comment_id',commentIds);if(!likeError)(likes||[]).forEach(l=>{const row=state.commentLikes[l.comment_id]||(state.commentLikes[l.comment_id]={count:0,liked:false});row.count++;if(l.user_id===state.user?.id)row.liked=true})}const ids=[...new Set(state.comments.map(x=>x.user_id).filter(Boolean))];if(ids.length){const {data:ps,error:pe}=await db.from('profiles').select('id,username,display_name,avatar_url').in('id',ids);if(!pe)(ps||[]).forEach(p=>state.profiles[p.id]=p)}if(ch.error)console.warn(ch.error);if(co.error)console.warn(co.error)}

// Storage-saving helpers: compress still images before upload and remove replaced/orphaned files.
const MAX_IMAGE_UPLOAD_BYTES=8*1024*1024;
const MAX_GIF_UPLOAD_BYTES=5*1024*1024;
async function prepareImageForUpload(file,maxDimension=1600){
 if(!file||file.type==='image/gif'||!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
 try{
  const bitmap=await createImageBitmap(file);
  const scale=Math.min(1,maxDimension/Math.max(bitmap.width,bitmap.height));
  const width=Math.max(1,Math.round(bitmap.width*scale)),height=Math.max(1,Math.round(bitmap.height*scale));
  const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
  const ctx=canvas.getContext('2d',{alpha:true});if(!ctx){bitmap.close?.();return file}
  ctx.drawImage(bitmap,0,0,width,height);bitmap.close?.();
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',0.82));
  if(!blob||blob.size>=file.size)return file;
  return new File([blob],(file.name.replace(/\.[^.]+$/,'')||'upload')+'.webp',{type:'image/webp',lastModified:Date.now()});
 }catch(err){console.warn('Image compression unavailable; uploading original file.',err);return file}
}
function storagePathFromPublicUrl(bucket,url){
 try{
  if(!url)return null;
  const parsed=new URL(url,location.origin);
  const marker='/storage/v1/object/public/'+bucket+'/';
  const at=parsed.pathname.indexOf(marker);
  if(at<0)return null;
  return parsed.pathname.slice(at+marker.length).split('/').map(part=>decodeURIComponent(part)).join('/');
 }catch{return null}
}
async function removeStoredPublicFile(bucket,url){
 const path=storagePathFromPublicUrl(bucket,url);
 if(!path)return;
 const {error}=await db.storage.from(bucket).remove([path]);
 if(error)console.warn('Could not clean up old '+bucket+' file:',error.message);
}

function reviewCards(){
 const comments=[...state.comments];
 const sortMode=state.commentSort;
 const byDate=(a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0);
 const byLikes=(a,b)=>(state.commentLikes[b.id]?.count||0)-(state.commentLikes[a.id]?.count||0)||byDate(b,a);
 comments.sort(sortMode==='oldest'?byDate:sortMode==='top'?byLikes:(a,b)=>byDate(b,a));
 if(!comments.length)return '<div class="empty">No comments yet. Be the first to share your thoughts.</div>';
 const card=x=>{
  const p=state.profiles[x.user_id]||{username:'reader',display_name:x.user_id===state.user?.id?'You':'Reader',avatar_url:''};
  const likes=state.commentLikes[x.id]||{count:0,liked:false};
  const isMine=x.user_id===state.user?.id;
  const isReply=!!x.parent_comment_id;
  const isReplying=state.replyingTo===x.id;
  return '<article class="review '+(isReply?'reply-card':'')+'" id="comment-'+esc(x.id)+'" data-comment-id="'+esc(x.id)+'">'+
   '<div class="review-head"><a class="profile-link" href="#/profile/'+esc(p.username||'reader')+'">'+profileAvatar(p,'profile-avatar')+'<span><strong>'+esc(p.display_name||'Reader')+'</strong><span class="muted small" style="display:block">@'+esc(p.username||'reader')+'</span></span></a><time datetime="'+esc(x.created_at||'')+'">'+esc(fmtDate(x.created_at))+'</time></div>'+
   (x.body?'<div class="review-body">'+esc(x.body)+'</div>':'')+
   (x.media_url?'<img loading="lazy" src="'+esc(img(x.media_url))+'" alt="'+(x.media_type==='gif'?'Attached GIF':'Attached image')+'">':'')+
   '<div class="comment-actions"><button type="button" class="chip '+(likes.liked?'liked':'')+'" data-like-comment="'+esc(x.id)+'" aria-pressed="'+String(!!likes.liked)+'" aria-label="'+(likes.liked?'Unlike':'Like')+' comment">♥ <span>'+Number(likes.count||0)+'</span></button>'+
   (!isReply?'<button type="button" class="chip" data-reply-comment="'+esc(x.id)+'" aria-expanded="'+String(isReplying)+'">'+(isReplying?'Cancel reply':'↳ Reply')+'</button>':'')+
   (isMine?'<button type="button" class="chip" data-delete-post="'+esc(x.id)+'">Delete</button>':'<button type="button" class="chip" data-report-comment="'+esc(x.id)+'">⚑ Report</button>')+'</div>'+
   (isReplying?'<form class="comment-inline-reply" data-reply-form="'+esc(x.id)+'"><label class="field"><span class="sr-only">Write a reply</span><textarea name="reply" maxlength="3000" rows="3" required placeholder="Write a thoughtful reply…"></textarea></label><div class="comment-actions"><button type="button" class="chip" data-cancel-reply>Cancel</button><button type="submit" class="btn primary">Reply</button></div><p class="muted small" data-reply-status aria-live="polite"></p></form>':'')+
  '</article>'
 };
 const parents=comments.filter(x=>!x.parent_comment_id||!comments.some(p=>p.id===x.parent_comment_id));
 const childMap=new Map();
 comments.filter(x=>x.parent_comment_id&&comments.some(p=>p.id===x.parent_comment_id)).forEach(x=>{if(!childMap.has(x.parent_comment_id))childMap.set(x.parent_comment_id,[]);childMap.get(x.parent_comment_id).push(x)});
 const rendered=parents.map(parent=>{
  const replies=(childMap.get(parent.id)||[]).sort(byDate);
  return card(parent)+(replies.length?'<div class="comment-reply-wrap">'+replies.map(card).join('')+'</div>':'');
 }).join('');
 return '<div class="review-list" aria-live="polite">'+rendered+'</div>'
}
function bindCommentControls(){
 const root=document.getElementById('tab-community');if(!root)return;
 root.querySelectorAll('[data-like-comment]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.onclick=()=>toggleCommentLike(b.dataset.likeComment,b)});
 root.querySelectorAll('[data-reply-comment]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.onclick=()=>{state.replyingTo=state.replyingTo===b.dataset.replyComment?null:b.dataset.replyComment;const posts=document.getElementById('entry-posts');if(posts)posts.innerHTML=reviewCards();bindCommentControls();const input=root.querySelector('[data-reply-form] textarea');input?.focus()}});
 root.querySelectorAll('[data-cancel-reply]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.onclick=()=>{state.replyingTo=null;const posts=document.getElementById('entry-posts');if(posts)posts.innerHTML=reviewCards();bindCommentControls()}});
 root.querySelectorAll('[data-reply-form]').forEach(form=>{if(form.dataset.bound)return;form.dataset.bound='1';form.onsubmit=submitReply});

async function ensureProfile(){if(!state.user)return null;let {data,error}=await db.from('profiles').select('*').eq('id',state.user.id).maybeSingle();if(error)console.warn('Profile lookup failed',error.message);if(!data){const base=(state.user.email||'reader').split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,20)||'reader';const username=(base+'_'+state.user.id.replace(/-/g,'').slice(0,6)).slice(0,32);const result=await db.from('profiles').upsert({id:state.user.id,username,display_name:base.replace(/[_\.]/g,' ').replace(/\b\w/g,x=>x.toUpperCase())||'Reader',avatar_url:''},{onConflict:'id'}).select('*').single();data=result.data;if(result.error)console.warn('Profile create failed',result.error.message)}state.profile=data||null;if(data)state.profiles[data.id]=data;return data}

function formatStorageBytes(bytes){const n=Number(bytes)||0;if(n<1024)return n+' B';if(n<1024*1024)return (n/1024).toFixed(1)+' KB';if(n<1024*1024*1024)return (n/1024/1024).toFixed(2)+' MB';return (n/1024/1024/1024).toFixed(2)+' GB'}

async function fetchNews(){
if(state.newsLoading)return;
state.newsLoading=true;state.newsError='';render(true);
const all=[];
const cleanText=v=>{const node=new DOMParser().parseFromString(String(v||''),'text/html');return (node.body.textContent||'').replace(/\s+/g,' ').trim()};
const addItems=(items,source)=>{(items||[]).forEach(item=>{const rawDescription=String(item.description||item.content||item.summary||'');const htmlDoc=new DOMParser().parseFromString(rawDescription,'text/html');const embedded=htmlDoc.querySelector('img')?.getAttribute('src')||'';const enclosure=item.enclosure?.link||item.enclosure?.url||item.thumbnail||item.image||item.media?.url||'';const image=safeUrl(enclosure||embedded);const title=cleanText(item.title);const link=safeUrl(item.link||item.guid||item.url);if(!title||!link)return;const published=item.pubDate||item.published||item.isoDate||item.date||'';const parsed=new Date(published);if(published&&!Number.isNaN(parsed.getTime())&&Date.now()-parsed.getTime()>14*86400000)return;const description=cleanText(rawDescription);all.push({title,link,image,date:published&&!Number.isNaN(parsed.getTime())?parsed.toISOString():new Date().toISOString(),description:description.slice(0,260),source:item.source||source,category:newsCategory({title,description,source:item.source||source})})})};
try{
 const res=await fetch('/api/news',{cache:'no-store',headers:{Accept:'application/json'},signal:AbortSignal.timeout(18000)});
 if(!res.ok)throw Error('News endpoint returned '+res.status);
 const payload=await res.json();
 if(!Array.isArray(payload.feeds))throw Error(payload.error||'News endpoint returned an invalid response');
 payload.feeds.forEach(feed=>addItems(feed.items,feed.label||'News source'));
 if(!all.length)throw Error(payload.error||'The news endpoint returned no usable articles.');
}catch(apiError){
 console.warn('Same-origin news endpoint unavailable; trying RSS fallback:',apiError);
 await Promise.all(NEWS_FEEDS.slice(0,3).map(async feed=>{try{const url='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed.url);const res=await fetch(url,{signal:AbortSignal.timeout(10000),cache:'no-store'});if(!res.ok)throw Error('RSS conversion returned '+res.status);const data=await res.json();if(data.status!=='ok'||!Array.isArray(data.items))throw Error(data.message||'Invalid RSS response');addItems(data.items,feed.label)}catch(err){console.warn('Fallback news feed failed:',feed.label,err.message)}}));
 if(!all.length)state.newsError='News providers could not be reached. Please try Refresh news again later.';
}
const dedup=new Map();
all.sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(item=>{const key=item.title.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,110);if(!dedup.has(key))dedup.set(key,item)});
state.news=[...dedup.values()].slice(0,60);

render(true);
}

r:'numeric',month:'short',day:'numeric',timeZone:'UTC'}),day:String(d.day).padStart(2,'0'),month:date.toLocaleDateString(undefined,{month:'short',timeZone:'UTC'}),confirmed:true})})}state.releases=anime.sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,25);state.releaseLoading=false;render(true)}catch(e){state.releaseLoading=false;console.error('Release dates unavailable',e);if(box)box.textContent='Could not load dates right now. Please try Update dates again.';state.releaseLoading=false}}

async function submitComment(e){
 e.preventDefault();
 if(!state.user)return notify('Sign in to comment');
 const form=e.currentTarget,t=state.selected,status=form.querySelector('#comment-status'),body=form.elements.body.value.trim(),file=form.elements.media.files?.[0];
 if(!t?.id)return notify('Open an entry before commenting.');

 if(body.length>3000){status.textContent='Comments must be 3,000 characters or fewer.';return}
 if(file&&(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)||file.size>MAX_IMAGE_UPLOAD_BYTES||(file.type==='image/gif'&&file.size>MAX_GIF_UPLOAD_BYTES))){status.textContent='Choose a JPG, PNG, WebP or GIF. Images must be under 8 MB; GIFs under 5 MB.';return}
 const button=form.querySelector('button[type=submit]');if(button?.disabled)return;
 if(button)button.disabled=true;status.textContent='Posting…';let uploadedPath=null;
 try{
  let media_url=null,media_type=null;
  if(file){
   const prepared=await prepareImageForUpload(file,1600),ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'})[prepared.type]||'img';
   uploadedPath=state.user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
   const up=await db.storage.from('community-media').upload(uploadedPath,prepared,{contentType:prepared.type,cacheControl:'31536000',upsert:false});
   if(up.error)throw up.error;
   media_url=db.storage.from('community-media').getPublicUrl(uploadedPath).data.publicUrl;media_type=prepared.type==='image/gif'?'gif':'image';
  }
  const {data,error}=await db.from('community_comments').insert({title_id:t.id,user_id:state.user.id,body,media_url,media_type}).select('id,user_id,body,media_url,media_type,created_at,parent_comment_id').single();
  if(error)throw error;
  uploadedPath=null;state.comments.unshift(data);state.replyingTo=null;
  if(!state.profiles[state.user.id]){const {data:p}=await db.from('profiles').select('id,username,display_name,avatar_url').eq('id',state.user.id).maybeSingle();if(p)state.profiles[p.id]=p}
  form.reset();status.textContent='';const posts=document.getElementById('entry-posts');if(posts)posts.innerHTML=reviewCards();bindCommentControls();notify('Comment posted');
 }catch(err){if(uploadedPath)await db.storage.from('community-media').remove([uploadedPath]);status.textContent=err.message||'Unable to post. Please try again.'}
 finally{if(button)button.disabled=false}
}

function bindProfile(form){
 form.onsubmit=async e=>{
  e.preventDefault();if(!state.user)return;
  const status=form.querySelector('#profile-status'),f=form.elements;
  status.textContent='Saving profile…';const uploadedPaths=[];
  try{
   const username=f.username.value.trim().toLowerCase(),display_name=f.display_name.value.trim(),bio=f.bio.value.trim();
   if(!/^[a-z0-9_]{2,32}$/.test(username)){status.textContent='Username must be 2–32 letters, numbers or underscores.';return}
   if(bio.length>280){status.textContent='Your bio must be 280 characters or fewer.';return}
   let avatar_url=state.profile?.avatar_url||'',banner_url=state.profile?.banner_url||'';
   const previousAvatarUrl=avatar_url,previousBannerUrl=banner_url;
   const uploadImage=async(file,folder,maxDimension)=>{
    if(!file)return null;
    if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)||file.size>MAX_IMAGE_UPLOAD_BYTES||(file.type==='image/gif'&&file.size>MAX_GIF_UPLOAD_BYTES))throw new Error('Choose a JPG, PNG, WebP or GIF. Images must be under 8 MB; GIFs under 5 MB.');
    const prepared=await prepareImageForUpload(file,maxDimension),ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'})[prepared.type]||'img';
    const path=state.user.id+'/'+folder+'-'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
    const {error}=await db.storage.from('avatars').upload(path,prepared,{contentType:prepared.type,cacheControl:'31536000',upsert:false});
    if(error)throw new Error((folder==='avatar'?'Avatar':'Banner')+' upload failed: '+error.message);
    uploadedPaths.push(path);return db.storage.from('avatars').getPublicUrl(path).data.publicUrl;
   };
   const nextAvatar=await uploadImage(f.avatar.files?.[0],'avatar',512);
   const nextBanner=await uploadImage(f.banner.files?.[0],'banner',1800);
   if(nextAvatar)avatar_url=nextAvatar;if(nextBanner)banner_url=nextBanner;
   const {data,error}=await db.from('profiles').upsert({id:state.user.id,username,display_name,bio,banner_url,avatar_url,updated_at:new Date().toISOString()},{onConflict:'id'}).select('*').single();
   if(error)throw new Error(error.code==='23505'?'That username is already taken. Choose another.':error.message);
   uploadedPaths.length=0;state.profile=data;state.profiles[data.id]=data;
   if(previousAvatarUrl&&previousAvatarUrl!==avatar_url)await removeStoredPublicFile('avatars',previousAvatarUrl);
   if(previousBannerUrl&&previousBannerUrl!==banner_url)await removeStoredPublicFile('avatars',previousBannerUrl);
   status.textContent='Profile saved!';notify('Profile updated');render();
  }catch(err){
   if(uploadedPaths.length)await db.storage.from('avatars').remove(uploadedPaths);
   console.error('Profile save failed',err);status.textContent=err?.message||'Could not save profile. Please try again.';
  }
 };
}
function bindAdmin(form){app.querySelectorAll('[data-edit-title]').forEach(b=>b.onclick=()=>loadAdminTitle(b.dataset.editTitle,form));app.querySelectorAll('[data-remove-title]').forEach(b=>b.onclick=()=>removeAdminTitle(b.dataset.removeTitle));const searchBtn=document.getElementById('anilist-search');if(searchBtn)searchBtn.onclick=()=>searchAniList(form);form.onsubmit=async e=>{e.preventDefault();if(!state.admin)return notify('Admin access required');const f=form.elements,st=form.querySelector('#admin-status'),id=f.id.value;const data={name:f.name.value.trim(),media_type:f.media_type.value,alternative_names:f.alternative_names.value.split(',').map(x=>x.trim()).filter(Boolean),cover_url:f.cover_url.value.trim(),banner_url:f.banner_url.value.trim(),synopsis:f.synopsis.value.trim(),genres:f.genres.value.split(',').map(x=>x.trim()).filter(Boolean),themes:f.themes.value.split(',').map(x=>x.trim()).filter(Boolean),status:f.status.value,release_year:f.release_year.value?Number(f.release_year.value):null,rating:f.rating.value?Number(f.rating.value):null,chapters:f.chapters.value||null,episodes:f.episodes.value||null,author:f.author.value||null,artist:f.artist.value||null,studio:f.studio.value||null,country:f.country.value||null,source_url:f.source_url.value||null,anilist_id:f.anilist_id.value?Number(f.anilist_id.value):null,trailer_url:f.trailer_url.value.trim()||null,is_featured:f.is_featured.checked,is_trending:f.is_trending.checked,updated_at:new Date().toISOString()};st.textContent='Saving…';const res=id?await db.from('titles').update(data).eq('id',id).select('id').single():await db.from('titles').insert(data).select('id').single();if(res.error){st.textContent='Save failed ('+res.error.code+'): '+res.error.message+(res.error.code==='42501'?' — Supabase admin policy denied this account. Sign in with the admin email and verify public.admin_users.':'');notify(st.textContent);return}if(!res.data?.id){st.textContent='Supabase did not return a saved title ID. Check the insert policy and permissions.';return}const charName=f.character_name.value.trim();const chars=[...(window.pendingAniCharacters||[])];if(charName)chars.unshift({name:charName,role:f.character_role.value||'Supporting',image_url:f.character_image.value||'',description:f.character_description.value||''});if(chars.length){const existing=await db.from('characters').delete().eq('title_id',res.data.id);if(existing.error)console.warn('Could not replace old character metadata:',existing.error.message);const ch=await db.from('characters').insert(chars.map(c=>({title_id:res.data.id,name:c.name,role:c.role||'Supporting',image_url:c.image_url||'',description:c.description||''})));if(ch.error)st.textContent='Title saved, but character import failed: '+ch.error.message;else{st.textContent='Title and '+chars.length+' character(s) saved.';window.pendingAniCharacters=[]}}else st.textContent='Title saved.';await loadTitles();render();if(location.hash!=='#/admin')location.hash='#/admin';notify(id?'Entry updated successfully':'New entry added successfully')};document.getElementById('admin-clear').onclick=()=>{form.reset();form.elements.id.value='';form.querySelector('#admin-status').textContent='New entry ready.';window.pendingAniCharacters=[];document.getElementById('anilist-results').innerHTML=''};document.getElementById('anilist-fetch').onclick=()=>fetchAniList(form)}
async function loadAdminTitle(id,form){const t=state.titles.find(x=>x.id===id);if(!t)return;const f=form.elements;f.id.value=t.id;for(const k of ['name','media_type','cover_url','banner_url','synopsis','status','release_year','rating','chapters','episodes','author','artist','studio','country','source_url','anilist_id','trailer_url'])if(f[k])f[k].value=t[k]??'';for(const k of ['alternative_names','genres','themes'])if(f[k])f[k].value=(t[k]||[]).join(', ');f.is_featured.checked=!!t.is_featured;f.is_trending.checked=!!t.is_trending;const {data}=await db.from('characters').select('*').eq('title_id',id).order('created_at',{ascending:false}).limit(60);window.pendingAniCharacters=(data||[]).map(c=>({name:c.name,role:c.role,image_url:c.image_url,description:c.description}));form.querySelector('#admin-status').textContent='Editing “'+t.name+'”. Save changes when ready.';form.scrollIntoView({behavior:'smooth',block:'start'});}
async function removeAdminTitle(id){if(!state.admin||!confirm('Delete this title and its catalogue entry?'))return;const {error}=await db.from('titles').delete().eq('id',id);if(error)return notify('Delete failed: '+error.message);await loadTitles();render();notify('Title deleted')}
async function searchAniList(form){const q=document.getElementById('anilist-query').value.trim();const box=document.getElementById('anilist-results');if(!q)return notify('Enter a title or AniList ID.');box.innerHTML='<div class="loading">Searching AniList…</div>';const n=Number(q);if(Number.isInteger(n)&&n>0){form.elements.anilist_id.value=n;await fetchAniList(form);box.innerHTML='<div class="muted small">Fetched AniList ID '+n+'. Review the form below and save.</div>';return}const query='query ($search:String,$type:MediaType){Page(page:1,perPage:12){media(search:$search,type:$type,sort:SEARCH_MATCH){id type title{romaji english native} format status startDate{year} coverImage{large extraLarge} bannerImage description(asHtml:false) genres averageScore chapters episodes countryOfOrigin}}}';try{const response=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables:{search:q,type:form.elements.media_type.value==='Anime'?'ANIME':'MANGA'}})});const payload=await response.json();if(!response.ok)throw Error(payload.errors?.[0]?.message||'AniList search request failed');const rows=payload.data?.Page?.media||[];if(!rows.length){box.innerHTML='<div class="empty">No AniList results found. Try another title.</div>';return}box.innerHTML=rows.map(m=>'<div class="library-row"><img src="'+esc(m.coverImage?.large||'')+'" alt=""><div class="grow"><strong>'+esc(m.title?.english||m.title?.romaji||m.title?.native||'Untitled')+'</strong><div class="muted small">'+esc(m.type==='ANIME'?'ANIME':'MANGA')+' · '+esc(m.format||'FORMAT UNKNOWN')+' · '+esc(m.startDate?.year||'Year unknown')+' · AniList #'+m.id+'</div><div class="muted small">'+esc((m.genres||[]).slice(0,4).join(' · '))+'</div></div><button class="btn primary" type="button" data-import-anilist="'+m.id+'">Use entry</button></div>').join('');box.querySelectorAll('[data-import-anilist]').forEach(b=>b.onclick=async()=>{form.elements.anilist_id.value=b.dataset.importAnilist;await fetchAniList(form);box.innerHTML='<div class="muted small">Metadata loaded into the form. Review title, cover and banner links, then save.</div>';form.scrollIntoView({behavior:'smooth',block:'start'})})}catch(e){box.innerHTML='<div class="empty">AniList search failed: '+esc(e.message)+'</div>'}}
async function fetchAniList(form){const id=Number(form.elements.anilist_id.value);if(!id){notify('Enter an AniList ID first.');return}const status=form.querySelector('#admin-status');status.textContent='Fetching AniList metadata…';const query='query ($id:Int){Media(id:$id){id trailer{id site} title{romaji english native} synonyms description(asHtml:false) type format status startDate{year} averageScore popularity genres tags{name} coverImage{extraLarge large} bannerImage season seasonYear chapters episodes countryOfOrigin siteUrl staff(perPage:20,sort:RELEVANCE){edges{role node{name{full}}}} studios(isMain:true){nodes{name}} characters(perPage:30,sort:ROLE){edges{role node{name{full} image{large} description(asHtml:false)}}}}}';try{const res=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables:{id}})});const json=await res.json();const m=json.data?.Media;if(!m)throw Error(json.errors?.[0]?.message||'No AniList title found');const f=form.elements;f.name.value=m.title.english||m.title.romaji||m.title.native||'';f.alternative_names.value=[m.title.romaji,m.title.native].filter(Boolean).filter(x=>x!==f.name.value).join(', ');f.synopsis.value=(m.description||'').replace(/<[^>]*>/g,'');f.genres.value=(m.genres||[]).join(', ');f.status.value=({'RELEASING':'Ongoing','FINISHED':'Completed','NOT_YET_RELEASED':'Upcoming','CANCELLED':'Cancelled','HIATUS':'Hiatus'})[m.status]||'Ongoing';f.release_year.value=m.startDate?.year||m.seasonYear||'';f.rating.value=m.averageScore?Math.round(m.averageScore/10*10)/10:'';f.chapters.value=m.chapters||'';f.episodes.value=m.episodes||'';f.country.value=m.countryOfOrigin||'';f.anilist_id.value=m.id;if(!f.trailer_url.value.trim()&&m.trailer?.id){const ts=String(m.trailer.site||'').toLowerCase();if(ts==='youtube')f.trailer_url.value='https://www.youtube.com/watch?v='+m.trailer.id;else if(ts==='dailymotion')f.trailer_url.value='https://www.dailymotion.com/video/'+m.trailer.id}if(!f.cover_url.value.trim())f.cover_url.value=m.coverImage?.extraLarge||m.coverImage?.large||'';if(!f.banner_url.value.trim())f.banner_url.value=m.bannerImage||'';if(!f.source_url.value.trim())f.source_url.value=m.siteUrl||('https://anilist.co/'+(m.type==='ANIME'?'anime':'manga')+'/'+m.id);const staff=m.staff?.edges||[];if(!f.author.value.trim())f.author.value=staff.find(x=>/story|original creator|writer/i.test(x.role))?.node?.name?.full||'';if(!f.artist.value.trim())f.artist.value=staff.find(x=>/art|illustration|artist/i.test(x.role))?.node?.name?.full||'';if(!f.studio.value.trim())f.studio.value=(m.studios?.nodes||[]).map(x=>x.name).join(', ');if(!f.themes.value.trim())f.themes.value=(m.tags||[]).filter(x=>x.name).map(x=>x.name).slice(0,20).join(', ');window.pendingAniCharacters=(m.characters?.edges||[]).map(x=>({name:x.node.name.full,role:x.role||'Supporting',image_url:x.node.image?.large||'',description:x.node.description||''}));status.textContent='AniList metadata loaded. Check/edit the name, cover URL and banner URL, then Save title. '+window.pendingAniCharacters.length+' characters fetched.'}catch(e){status.textContent='AniList fetch failed: '+e.message}}
let searchDebounce=null;
const searchInput=document.getElementById('global-search'),searchSuggestions=document.getElementById('search-suggestions');
function hideSearchSuggestions(){if(!searchSuggestions)return;searchSuggestions.classList.add('hidden');searchInput?.setAttribute('aria-expanded','false')}
function showSearchSuggestions(){
 if(!searchInput||!searchSuggestions)return;
 const q=searchInput.value.trim().toLocaleLowerCase();
 if(q.length<2){hideSearchSuggestions();return}
 const results=(state.titleIndex.length?state.titleIndex:state.titles.map(t=>({t,names:[titleName(t),...(t.alternative_names||[])].filter(Boolean),genreText:(t.genres||[]).join(' ').toLocaleLowerCase()}))).map(x=>{const exact=x.names.some(n=>String(n).toLocaleLowerCase()===q);const starts=x.names.some(n=>String(n).toLocaleLowerCase().startsWith(q));const contains=x.names.some(n=>String(n).toLocaleLowerCase().includes(q));const genre=x.genreText.includes(q);return {t:x.t,score:exact?4:starts?3:contains?2:genre?1:0}}).filter(x=>x.score).sort((a,b)=>b.score-a.score||Number(b.t.popularity||0)-Number(a.t.popularity||0)||Number(b.t.rating||0)-Number(a.t.rating||0)).slice(0,7);
 if(!results.length){searchSuggestions.innerHTML='<div class="search-suggestion-empty">No matches yet. Press Enter to search the catalogue.</div>'}
 else searchSuggestions.innerHTML='<div class="search-suggestion-label">QUICK RESULTS</div>'+results.map(({t})=>'<button class="search-suggestion" type="button" role="option" data-search-open="'+esc(t.id)+'"><img src="'+esc(img(t.cover_url))+'" alt="" loading="lazy"><span class="search-suggestion-copy"><strong>'+esc(titleName(t))+'</strong><small>'+esc(media(t))+' · '+esc(t.release_year||'Year unknown')+'</small></span><span class="search-suggestion-arrow">↗</span></button>').join('')+'<button class="search-all-results" type="button" data-search-all>See all results for “'+esc(searchInput.value.trim())+'” →</button>';
 searchSuggestions.classList.remove('hidden');searchInput.setAttribute('aria-expanded','true')
}
searchInput.addEventListener('input',e=>{state.search=e.target.value;state.browsePage=1;showSearchSuggestions();clearTimeout(searchDebounce);searchDebounce=setTimeout(()=>{applyFilters();if(!['/title/','/account','/admin','/news','/profile/'].some(x=>state.route.startsWith(x))){if(state.route==='/')render();else if(state.route==='/browse')render()}},140)});
searchInput.addEventListener('keydown',e=>{if(e.key==='Escape'){hideSearchSuggestions();return}if(e.key==='Enter'){e.preventDefault();hideSearchSuggestions();location.hash='#/browse';render()}});
searchSuggestions.addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
searchSuggestions.addEventListener('click',e=>{const item=e.target.closest('[data-search-open]');if(item){hideSearchSuggestions();searchInput.blur();openTitle(item.dataset.searchOpen);return}if(e.target.closest('[data-search-all]')){hideSearchSuggestions();location.hash='#/browse';render()}});
document.addEventListener('click',e=>{if(!e.target.closest('.global-search-wrap'))hideSearchSuggestions()});
document.getElementById('account-btn').onclick=()=>{location.hash='#/account'};document.getElementById('mobile-account').onclick=()=>{location.hash='#/account'};document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>location.hash=b.dataset.route);document.querySelectorAll('[data-nav-route]').forEach(b=>b.classList.toggle('active',b.dataset.navRoute===(location.hash.replace(/^#/, '')||'/')));document.getElementById('year').textContent=new Date().getFullYear();
async function routeChanged(){const route=location.hash.replace(/^#/, '')||'/';if(route.startsWith('/title/')){const id=route.slice(7);if(state.titles.some(t=>t.id===id)){state.selected=state.titles.find(t=>t.id===id);await loadEntryExtras(id)}}render()}window.addEventListener('hashchange',routeChanged);window.addEventListener('popstate',routeChanged);
db.auth.onAuthStateChange((event,session)=>{setTimeout(async()=>{try{await refreshUser();if(state.user)await ensureProfile();if(state.route.startsWith('/title/')&&state.selected)await loadEntryExtras(state.selected.id);render()}catch(error){console.error('Auth refresh failed',error);notify('Account refresh failed: '+(error?.message||'unknown error'))}},0)});
function withTimeout(promise,label,ms=9000){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timed out after '+ms+'ms')),ms))])}
async function startup(){
  // Render a usable shell immediately. Auth, catalogue and footer settings must never
  // block the first paint; each service can fail independently.
  render();
  try{
    await withTimeout(refreshUser(),'Authentication check',7000);
    if(state.user)await withTimeout(ensureProfile(),'Reader profile setup',7000);
  }catch(error){console.error('Startup auth/profile step failed:',error);state.user=state.user||null}
  render();
  try{
    await withTimeout(loadTitles(),'Catalogue request',10000);
  }catch(error){console.error('Startup catalogue request failed:',error);notify('Catalogue is taking too long to respond. Please refresh in a moment.')}
  const initialRoute=location.hash.replace(/^#/, '')||'/';
  if(initialRoute.startsWith('/title/')){
    state.selected=state.titles.find(t=>String(t.id)===initialRoute.slice(7))||null;
    if(state.selected){
      try{await withTimeout(loadEntryExtras(state.selected.id),'Title details',7000)}catch(error){console.warn('Title details unavailable:',error)}
      loadEntryTrailer(state.selected);
    }
  }
  render();
  if(state.route.startsWith('/title/')&&state.selected)loadEntryTrailer(state.selected);
  // Footer settings are non-essential and must not delay page content.
  try{
    const {data,error}=await withTimeout(db.from('site_settings').select('key,value').in('key',['social_links','footer_links']),'Footer settings',5000);
    if(error)throw error;
    if(data){
      const setting=Object.fromEntries(data.map(x=>[x.key,x.value]));
      const values=setting.social_links||setting.footer_links||[];
      if(Array.isArray(values))document.getElementById('footer-links').innerHTML=values.filter(x=>x?.url&&x?.label).map(x=>'<a style="margin-right:14px" href="'+esc(img(x.url))+'" target="_blank" rel="noopener">'+esc(x.label)+'</a>').join('');
    }
  }catch(error){console.warn('Footer settings skipped:',error)}
}
startup().catch(error=>{console.error('Fatal startup error:',error);app.innerHTML='<section class="section"><div class="empty"><h2>7MANGA is taking longer than expected.</h2><p>Core content could not finish loading. Check your connection and try again.</p><button class="btn primary" type="button" onclick="location.reload()">Retry</button></div></section>'});
})();
