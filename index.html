<body>
  <div id="root"></div>
  
  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    (() => {
      const cfg = window.APP_CONFIG;
      if (!cfg?.supabaseUrl || !cfg?.supabaseKey || !window.supabase?.createClient) {
        console.warn("7manga: Supabase config or client library is unavailable.");
        return;
      }
      window.__7mangaSupabase = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });

      // A small, independent sign-in panel; catalog writes remain protected by database RLS.
      const addAuthUI = () => {
        if (document.getElementById("seven-auth-trigger")) return;
        const style = document.createElement("style");
        style.textContent = `
          #seven-auth-trigger{position:fixed;right:16px;bottom:16px;z-index:9998;border:1px solid #ffffff28;
            border-radius:999px;padding:10px 15px;background:#17171ce8;color:#fff;font:11px/1.2 ui-monospace,monospace;
            letter-spacing:.12em;backdrop-filter:blur(12px);box-shadow:0 8px 28px #0007}
          #seven-auth-overlay{position:fixed;inset:0;z-index:9999;display:none;place-items:center;padding:18px;background:#000a}
          #seven-auth-overlay.open{display:grid}
          #seven-auth-card{width:min(100%,390px);padding:24px;border:1px solid #ffffff20;border-radius:22px;background:#101014;color:#fff;
            box-shadow:0 25px 80px #000a;font:14px/1.5 system-ui,sans-serif}
          #seven-auth-card input{display:block;width:100%;margin:8px 0 12px;padding:12px;border-radius:10px;border:1px solid #ffffff20;background:#08080a;color:#fff}
          #seven-auth-card button{border:1px solid #ffffff24;border-radius:999px;padding:10px 14px}
          #seven-auth-message{min-height:20px;margin:10px 0;color:#bdb7d4;font-size:12px;overflow-wrap:anywhere}
          #seven-auth-card .primary{background:#fff;color:#08080a;border-color:#fff}
        `;
        document.head.appendChild(style);
        const trigger = document.createElement("button");
        trigger.id = "seven-auth-trigger";
        trigger.type = "button";
        trigger.textContent = "ACCOUNT";
        trigger.setAttribute("aria-label", "Open 7manga account panel");
        const overlay = document.createElement("div");
        overlay.id = "seven-auth-overlay";
        overlay.innerHTML = `<section id="seven-auth-card" role="dialog" aria-modal="true" aria-labelledby="seven-auth-title">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
            <strong id="seven-auth-title" style="letter-spacing:.12em">7MANGA ACCOUNT</strong>
            <button type="button" id="seven-auth-close" aria-label="Close">CLOSE</button>
          </div>
          <p style="color:#aaa;margin:12px 0 18px;font-size:12px">Sign in to manage titles. Database permissions still decide who can edit the catalog.</p>
          <form id="seven-auth-form">
            <label for="seven-auth-email">Email</label><input id="seven-auth-email" type="email" autocomplete="username" required>
            <label for="seven-auth-password">Password</label><input id="seven-auth-password" type="password" autocomplete="current-password" minlength="6" required>
            <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" type="submit" id="seven-auth-signin">SIGN IN</button>
              <button type="button" id="seven-auth-signup">CREATE ACCOUNT</button><button type="button" id="seven-auth-signout" hidden>SIGN OUT</button></div>
          </form><p id="seven-auth-message" role="status" aria-live="polite"></p>
        </section>`;
        document.body.append(trigger, overlay);
        const $ = id => document.getElementById(id);
        const msg = value => $("seven-auth-message").textContent = value;
        const refresh = async () => {
          const { data, error } = await window.__7mangaSupabase.auth.getSession();
          const session = data?.session;
          trigger.textContent = session ? "ACCOUNT · SIGNED IN" : "ACCOUNT";
          $("seven-auth-signout").hidden = !session;
          if (error) msg(error.message);
        };
        trigger.addEventListener("click", () => { overlay.classList.add("open"); refresh(); });
        $("seven-auth-close").addEventListener("click", () => overlay.classList.remove("open"));
        overlay.addEventListener("click", e => { if (e.target === overlay) overlay.classList.remove("open"); });
        $("seven-auth-form").addEventListener("submit", async e => {
          e.preventDefault();
          const email = $("seven-auth-email").value.trim();
          const password = $("seven-auth-password").value;
          msg("Signing in…");
          const { error } = await window.__7mangaSupabase.auth.signInWithPassword({ email, password });
          msg(error ? error.message : "Signed in. If catalog saving is denied, an administrator must add your user ID to public.admin_users.");
          await refresh();
        });
        $("seven-auth-signup").addEventListener("click", async () => {
          const email = $("seven-auth-email").value.trim();
          const password = $("seven-auth-password").value;
          if (!email || password.length < 6) { msg("Enter an email and a password of at least 6 characters."); return; }
          msg("Creating account…");
          const { data, error } = await window.__7mangaSupabase.auth.signUp({ email, password, options: { emailRedirectTo: window.location.origin + window.location.pathname } });
          msg(error ? error.message : (data.session ? "Welcome to 7MANGA — your account is ready." : "Welcome to 7MANGA! Check your inbox for your confirmation email, then return here to sign in."));
          await refresh();
        });
        $("seven-auth-signout").addEventListener("click", async () => {
          const { error } = await window.__7mangaSupabase.auth.signOut();
          msg(error ? error.message : "Signed out.");
          await refresh();
        });
        window.__7mangaSupabase.auth.onAuthStateChange((_event, session) => {
          trigger.textContent = session ? "ACCOUNT · SIGNED IN" : "ACCOUNT";
          $("seven-auth-signout").hidden = !session;
        });
      };
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", addAuthUI, { once: true });
      else addAuthUI();
    })();
  </script>

<script>
/* 7MANGA admin-only controls. Visibility is cosmetic; Supabase RLS remains the security boundary. */
(() => {
  const db = window.__7mangaSupabase;
  if (!db) return;
  let isAdmin = false;
  window.__7mangaIsAdmin = false;

  const updateMembership = async (session) => {
    isAdmin = false;
    window.__7mangaIsAdmin = false;
    document.body.classList.remove("seven-admin");
    if (session?.user?.id) {
      try {
        const { data, error } = await db.from("admin_users")
          .select("user_id").eq("user_id", session.user.id).maybeSingle();
        isAdmin = !error && !!data;
      } catch (_) { isAdmin = false; }
    }
    window.__7mangaIsAdmin = isAdmin;
    document.body.classList.toggle("seven-admin", isAdmin);
    applyControlVisibility();
  };

  const controlKind = (button) => {
    const label = (button.innerText || button.textContent || "").replace(/\s+/g, " ").trim().toUpperCase();
    if (label === "NEW TITLE" || label === "NEW" || label.includes("NEW TITLE")) return "create";
    if (label === "EDIT") return "edit";
    if (label === "DELETE") return "delete";
    if (label === "+ ADD" || label === "ADD") return "character";
    if (label.includes("SAVE TO 7MANGA")) return "save";
    return "";
  };

  const applyControlVisibility = () => {
    document.querySelectorAll("button").forEach(button => {
      const kind = controlKind(button);
      if (!kind) return;
      button.dataset.sevenAdminControl = kind;
      button.style.display = isAdmin ? "" : "none";
      button.setAttribute("aria-hidden", isAdmin ? "false" : "true");
      button.tabIndex = isAdmin ? 0 : -1;
    });
  };

  document.addEventListener("click", event => {
    const button = event.target?.closest?.("button");
    if (!button) return;
    const kind = controlKind(button);
    if (kind && !window.__7mangaIsAdmin) {
      event.preventDefault();
      event.stopImmediatePropagation();
      if (kind === "create" || kind === "edit" || kind === "delete" || kind === "save") {
        document.getElementById("seven-auth-trigger")?.click();
        const message = document.getElementById("seven-auth-message");
        if (message) message.textContent = "Sign in with an approved administrator account to manage titles.";
      }
    }
  }, true);

  const observer = new MutationObserver(applyControlVisibility);
  observer.observe(document.documentElement, { childList: true, subtree: true });
  db.auth.getSession().then(({ data }) => updateMembership(data?.session || null));
  db.auth.onAuthStateChange((_event, session) => {
    setTimeout(() => updateMembership(session || null), 0);
  });
})();
</script>

<script>
(function(){
 const boot=function(){

   if(!window.__7mangaIsAdmin)return;
   const lines=about.querySelector("#seven-social-input").value.split("\n");
   const links=lines.map(line=>{const i=line.indexOf(",");return i<0?null:{platform:line.slice(0,i).trim(),url:line.slice(i+1).trim()}}).filter(item=>item&&item.platform&&validUrl(item.url));
   const result=await db.from("site_settings").upsert({key:"social_links",value:{links},updated_at:new Date().toISOString()});
   about.querySelector("#seven-social-status").textContent=result.error?result.error.message:"Saved";
   if(!result.error)refreshSocial();
  };
  async function openLibrary(){
   library.classList.add("open");const box=library.querySelector("#seven-library-list");box.textContent="Loading…";
   const auth=await db.auth.getUser();if(!auth.data||!auth.data.user){box.textContent="Sign in to view your library.";document.getElementById("seven-auth-trigger")?.click();return}
   const result=await db.from("user_library").select("title_id,created_at,titles(id,name,cover_url,media_type)").order("created_at",{ascending:false});
   box.replaceChildren();if(result.error){box.textContent=result.error.message;return}
   if(!result.data||!result.data.length){box.textContent="Your library is empty. Tap ♡ Save on a title to add it.";return}
   result.data.forEach(row=>{const item=el("div",{});item.style.cssText="display:flex;gap:12px;align-items:center;border:1px solid #29292d;border-radius:12px;padding:10px";if(row.titles&&row.titles.cover_url){const img=el("img",{src:row.titles.cover_url,alt:row.titles.name||"Cover",loading:"lazy"});img.style.cssText="width:48px;height:68px;object-fit:cover;border-radius:6px";item.append(img)}const name=el("span",{},row.titles&&row.titles.name||"Saved title");name.style.flex="1";item.append(name);const remove=el("button",{class:"seven-mini-action",type:"button"},"REMOVE");remove.onclick=async()=>{const r=await db.from("user_library").delete().eq("title_id",row.title_id);if(r.error)alert(r.error.message);else openLibrary()};item.append(remove);box.append(item)});
  }
  function addSaveButtons(){
   document.querySelectorAll("#root img").forEach(img=>{
    if(img.dataset.sevenSaveReady||!img.src||img.closest("#seven-about-panel,#seven-library-panel"))return;
    let card=img.parentElement;
    for(let depth=0;depth<6&&card&&card!==document.body;depth++,card=card.parentElement){const rect=card.getBoundingClientRect();if(rect.width>120&&rect.height>130&&card.querySelector("button"))break}
    if(!card||card===document.body||card.dataset.sevenSaveReady)return;
    const lines=(card.innerText||"").split(/\n/).map(s=>s.trim()).filter(Boolean);
    const known=lines.find(s=>s.length>2&&s.length<100&&s.toLowerCase()!=="view archive");
    if(!known)return;
    const btn=el("button",{type:"button",class:"seven-mini-action"},"♡ SAVE");
    btn.style.cssText="position:absolute;right:8px;top:8px;z-index:8";
    if(getComputedStyle(card).position==="static")card.style.position="relative";
    btn.onclick=async event=>{
     event.preventDefault();event.stopPropagation();
     const auth=await db.auth.getUser();if(!auth.data||!auth.data.user){document.getElementById("seven-auth-trigger")?.click();return}
     const lookup=await db.from("titles").select("id,name").ilike("name",known).limit(1);
     if(lookup.error||!lookup.data||!lookup.data.length){alert("This title is not in the live database yet.");return}
     const title=lookup.data[0];
     const existing=await db.from("user_library").select("title_id").eq("title_id",title.id).maybeSingle();
     if(existing.data){const r=await db.from("user_library").delete().eq("title_id",title.id);if(!r.error)btn.textContent="♡ SAVE";else alert(r.error.message)}
     else{const r=await db.from("user_library").insert({user_id:auth.data.user.id,title_id:title.id});if(!r.error)btn.textContent="♥ SAVED";else alert(r.error.message)}
    };
    card.append(btn);card.dataset.sevenSaveReady="1";img.dataset.sevenSaveReady="1";
   });
  }
  function addAniListButton(){
   document.querySelectorAll(".seven-anilist-import").forEach(button=>button.remove());
   if(!window.__7mangaIsAdmin){document.querySelectorAll("#root input[data-seven-anilist-ready]").forEach(input=>delete input.dataset.sevenAniListReady);return;}
   const inputs=Array.from(document.querySelectorAll("#root input")).filter(input=>input.offsetParent!==null);
   const titleInput=inputs.find(input=>/title/i.test(input.placeholder||"")||(input.parentElement&&/title/i.test(input.parentElement.innerText||"")));
   if(!titleInput||titleInput.dataset.sevenAniListReady)return;
   titleInput.dataset.sevenAniListReady="1";
   const btn=el("button",{type:"button",class:"seven-mini-action seven-anilist-import"},"FETCH DETAILS FROM ANILIST");
   btn.style.cssText="display:block;margin:8px 0 12px";
   titleInput.insertAdjacentElement("afterend",btn);
   btn.onclick=async()=>{
    const q=titleInput.value.trim();if(!q){alert("Enter a manga title first.");return}
    btn.disabled=true;btn.textContent="FETCHING…";
    try{
     const query='query ($search:String){Media(search:$search,type:MANGA){id title{romaji english native} format status startDate{year} averageScore chapters volumes description(asHtml:false) genres staff(perPage:10){edges{role node{name{full}}}}}}';
     const response=await fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({query,variables:{search:q}})});
     const payload=await response.json();if(!response.ok)throw new Error("AniList request failed. Try again.");
     const media=payload.data&&payload.data.Media;if(!media)throw new Error("No matching manga found.");
     const fields=Array.from(document.querySelectorAll("#root input,#root textarea,#root select")).filter(input=>input.offsetParent!==null);
     const setField=(hints,value)=>{if(value===null||value===undefined||value==="")return;const field=fields.find(input=>hints.some(h=>((input.placeholder||"")+" "+(input.parentElement&&input.parentElement.innerText||"")).toLowerCase().includes(h)));if(!field)return;const val=Array.isArray(value)?value.join(", "):String(value);const setter=Object.getOwnPropertyDescriptor(Object.getPrototypeOf(field),"value")?.set;if(setter)setter.call(field,val);else field.value=val;field.dispatchEvent(new Event("input",{bubbles:true}));field.dispatchEvent(new Event("change",{bubbles:true}))};
     setField(["title"],media.title.english||media.title.romaji||q);
     setField(["alternative title","alt title"],[media.title.native,media.title.romaji].filter(Boolean).join(", "));
     setField(["author","mangaka"],(media.staff.edges.find(x=>/story|author|original/i.test(x.role))||{}).node?.name?.full);
     setField(["year"],media.startDate.year);
     setField(["rating"],media.averageScore?media.averageScore/10:null);
     setField(["chapter","episode"],media.chapters);
     setField(["synopsis","description"],(media.description||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim());
     setField(["genre"],media.genres);
     alert("AniList metadata fetched where matching fields were found. Add the cover image manually, then review before saving.");
    }catch(error){alert(error.message||"Could not fetch AniList details.")}
    finally{btn.disabled=false;btn.textContent="FETCH DETAILS FROM ANILIST"}
   };
  }
  const observer=new MutationObserver(()=>{addSaveButtons();addAniListButton()});
  observer.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
  addSaveButtons();addAniListButton();
 };
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot,{once:true});else boot();
})();
</script>
