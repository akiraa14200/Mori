character span{font-size:10px;color:var(--muted)}.community{margin-top:24px;scroll-margin-top:95px}.community-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.review-form{display:grid;gap:12px;margin:18px 0 22px}.field{display:grid;gap:7px;font-size:12px;color:#c8c8d1}.field input,.field textarea,.field select,.input{width:100%;border:1px solid var(--line);background:#0b0b10;color:white;border-radius:12px;padding:12px}.field textarea{resize:vertical;min-height:105px}.review-list{display:grid;gap:12px}.review{padding:15px;border:1px solid var(--line);background:#ffffff04;border-radius:15px;overflow-wrap:anywhere}.review-head{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;margin-bottom:9px}.review-body{white-space:pre-wrap;line-height:1.6}.review img{max-width:min(100%,460px);max-height:360px;object-fit:contain;border-radius:12px;margin-top:10px}.auth-layout{max-width:480px;margin:50px auto}.auth-layout h1{letter-spacing:-.05em}.form-stack{display:grid;gap:14px}.library-list{display:grid;gap:10px}.library-row{display:flex;align-items:center;gap:14px;padding:10px;border:1px solid var(--line);border-radius:14px}.library-row img{width:58px;height:76px;object-fit:cover;border-radius:8px}.library-row .grow{flex:1;min-width:0}.footer{border-top:1px solid var(--line);padding:30px 0 100px;color:var(--muted);font-size:12px;margin-top:50px}.toast{position:fixed;z-index:100;bottom:22px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 28px);padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:#202027f2;box-shadow:0 10px 35px #0008;font-size:13px}.mobile-nav{display:none}.hidden{display:none!important}.loading{padding:35px;text-align:center;color:var(--muted)}.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.admin-grid .wide{grid-column:1/-1}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}

<script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(()=>{'use strict';
const cfg=window.APP_CONFIG||{},app=document.getElementById('app'),toastNode=document.getElementById('toast');
if(!window.supabase||!cfg.supabaseUrl||!cfg.supabaseKey){app.innerHTML='<div class="empty">Site configuration is missing. Check config.js and the Supabase client.</div>';return}
const db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state={titles:[],filtered:[],user:null,admin:false,route:'/',selected:null,characters:[],library:new Set(),reviews:[],comments:[],slide:0,filter:'All',search:'',loading:false,settings:{}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>{try{const u=new URL(v,location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};
const img=(url,alt='')=>safeUrl(url)||'';
const fmtDate=v=>v?new Date(v).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'Recently added';
function notify(msg){toastNode.textContent=msg;toastNode.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toastNode.classList.add('hidden'),3200)}
function titleName(t){return t?.name||t?.title||'Untitled'}
function media(t){return t?.media_type||t?.type||'Manga'}
function card(t){return '<article class="card" data-open="'+esc(t.id)+'" tabindex="0" role="button" aria-label="Open '+esc(titleName(t))+'"><div class="cover"><img loading="lazy" src="'+esc(img(t.cover_url))+'" alt="'+esc(titleName(t))+'" onerror="this.style.opacity=.15"><span class="badge">'+esc(media(t))+'</span><span class="rating">★ '+esc(Number(t.rating||0).toFixed(1))+'</span></div><h3>'+esc(titleName(t))+'</h3><div class="meta">'+esc(t.release_year||'—')+' · '+esc(t.status||'Ongoing')+'</div></article>'}
function grid(list){return list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="empty">No titles found yet. Try another search or check back soon.</div>'}
function topTitle(text,sub=''){return '<div class="section-head"><div><h2>'+esc(text)+'</h2>'+(sub?'<p class="muted small">'+esc(sub)+'</p>':'')+'</div></div>'}
async function loadTitles(){const {data,error}=await db.from('titles').select('*').order('created_at',{ascending:false}).limit(1000);if(error){console.error(error);notify('Could not load catalogue: '+error.message);return}state.titles=data||[];applyFilters()}
function applyFilters(){const q=state.search.toLowerCase().trim();state.filtered=state.titles.filter(t=>{const matches=!q||[t.name,...(t.alternative_names||[]),t.synopsis,...(t.genres||[])].filter(Boolean).join(' ').toLowerCase().includes(q);const kind=state.filter==='All'||media(t)===state.filter;return matches&&kind})}
async function refreshUser(){const {data}=await db.auth.getUser();state.user=data?.user||null;state.admin=false;state.library.clear();if(state.user){const [a,l]=await Promise.all([db.from('admin_users').select('user_id').eq('user_id',state.user.id).maybeSingle(),db.from('user_library').select('title_id').eq('user_id',state.user.id)]);state.admin=!!a.data&&!a.error;(l.data||[]).forEach(x=>state.library.add(x.title_id))}document.getElementById('account-btn').textContent=state.user?(state.user.email?.split('@')[0]||'Account'):'Sign in'}
function hero(){const list=[...state.titles].sort((a,b)=>Number(!!b.is_featured)-Number(!!a.is_featured)||Number(!!b.is_trending)-Number(!!a.is_trending)||new Date(b.created_at)-new Date(a.created_at));if(!list.length)return '<section class="hero"><div class="hero-copy"><div class="eyebrow">Welcome to 7MANGA</div><h1>Stories beyond worlds.</h1><p>Your next obsession starts here. Browse the catalogue and find a world worth getting lost in.</p><a class="btn primary" href="#/browse">Explore catalogue ↗</a></div></section>';const t=list[state.slide%list.length];return '<section class="hero"><img class="hero-art" src="'+esc(img(t.banner_url||t.cover_url))+'" alt="" onerror="this.style.display=\'none\'"><div class="hero-copy"><div class="eyebrow">'+(t.is_featured?'✦ Featured story':'✦ Discover something new')+'</div><h1>'+esc(titleName(t))+'</h1><p>'+esc((t.synopsis||'A story waiting to be discovered.').slice(0,230))+'</p><div class="pills"><span class="pill">'+esc(media(t))+'</span><span class="pill">★ '+esc(Number(t.rating||0).toFixed(1))+'</span><span class="pill">'+esc(t.status||'Ongoing')+'</span></div><div class="hero-actions"><button class="btn primary" data-open="'+esc(t.id)+'">Explore title ↗</button><button class="btn" data-save="'+esc(t.id)+'">'+(state.library.has(t.id)?'♥ In library':'♡ Add to library')+'</button></div><div class="dots">'+list.slice(0,6).map((_,i)=>'<button aria-label="Slide '+(i+1)+'" class="dot '+(i===state.slide%Math.min(6,list.length)?'active':'')+'" data-slide="'+i+'"></button>').join('')+'</div></div></section>'}
function home(){const titles=state.filtered;return hero()+'<section class="section">'+topTitle('Made for your next binge','Freshly added to the 7MANGA catalogue')+grid([...state.titles].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,12))+'</section><section class="section">'+topTitle('Trending now','Stories readers are checking out')+grid([...state.titles].filter(t=>t.is_trending).sort((a,b)=>Number(b.popularity||0)-Number(a.popularity||0)).slice(0,12))+'</section><section class="section">'+topTitle('Explore the catalogue','Find your next favourite')+filters()+grid(titles.slice(0,18))+(titles.length>18?'<div style="text-align:center;margin-top:22px"><a class="btn" href="#/browse">View all titles →</a></div>':'')+'</section>'}
function filters(){const types=['All','Manga','Manhwa','Manhua','Anime','Light Novel','Web Novel'];return '<div class="filters">'+types.map(x=>'<button class="chip '+(state.filter===x?'active':'')+'" data-filter="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>'}
function browse(){return '<section class="section">'+topTitle('Explore stories','Search by title, genre, or alternative name')+filters()+grid(state.filtered)+'</section>'}
function facts(t){const pairs=[['Type',media(t)],['Status',t.status],['Release',t.release_year],['Chapters',t.chapters],['Episodes',t.episodes],['Author',t.author],['Artist',t.artist],['Studio',t.studio],['Country',t.country],['Season',t.season],['Source',t.source_url?'<a target="_blank" rel="noopener" href="'+esc(img(t.source_url))+'">Open source ↗</a>':'—']];return '<div class="facts">'+pairs.filter(([k,v])=>v).map(([k,v])=>'<div class="fact"><label>'+esc(k)+'</label><strong>'+(k==='Source'?v:esc(v))+'</strong></div>').join('')+'</div>'}
async function openTitle(id){const t=state.titles.find(x=>x.id===id);if(!t)return notify('This title is no longer available.');state.selected=t;state.route='/title/'+id;history.pushState({route:state.route},'', '#'+state.route);await loadEntryExtras(id);render()}
async function loadEntryExtras(id){const [ch,re,co]=await Promise.all([db.from('characters').select('*').eq('title_id',id).order('created_at',{ascending:false}).limit(60),db.from('title_reviews').select('id,user_id,rating,review,created_at,updated_at').eq('title_id',id).eq('is_hidden',false).order('created_at',{ascending:false}).limit(50),db.from('community_comments').select('id,user_id,body,media_url,media_type,created_at').eq('title_id',id).order('created_at',{ascending:false}).limit(50)]);state.characters=ch.data||[];state.reviews=re.data||[];state.comments=co.data||[];if(ch.error)console.warn(ch.error);if(re.error)console.warn(re.error);if(co.error)console.warn(co.error)}
function reviewCards(){const list=[...state.reviews.map(x=>({...x,kind:'review',body:x.review})),...state.comments.map(x=>({...x,kind:'comment'}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));if(!list.length)return '<div class="empty">No comments yet. Be the first to share your thoughts.</div>';return '<div class="review-list">'+list.map(x=>'<article class="review"><div class="review-head"><span>'+(x.user_id===state.user?.id?'You':'Reader')+' · '+(x.kind==='review'?'★ '+esc(x.rating)+'/10 · Review':'Comment')+'</span><span>'+esc(fmtDate(x.created_at))+'</span></div>'+(x.body?'<div class="review-body">'+esc(x.body)+'</div>':'')+(x.media_url?'<img loading="lazy" src="'+esc(img(x.media_url))+'" alt="'+(x.media_type==='gif'?'Attached GIF':'Attached image')+'">':'')+(x.user_id===state.user?.id?'<div style="text-align:right;margin-top:10px"><button class="chip" data-delete-post="'+esc(x.id)+'" data-kind="'+x.kind+'">Delete</button></div>':'')+'</article>').join('')+'</div>'}
function entry(t){const genres=(t.genres||[]).concat(t.themes||[]);const chars=state.characters.length?'<div class="characters">'+state.characters.map(c=>'<article class="character">'+(c.image_url?'<img loading="lazy" src="'+esc(img(c.image_url))+'" alt="'+esc(c.name)+'">':'<div style="height:150px;display:grid;place-items:center;color:#777">✦</div>')+'<div><strong>'+esc(c.name)+'</strong><span>'+esc(c.role||'Character')+'</span></div></article>').join('')+'</div>':'<p class="muted small">Character information has not been added yet.</p>';return '<article class="entry"><button class="chip" data-back style="margin:0 0 14px">← Back to catalogue</button><section class="entry-hero"><img class="entry-banner" src="'+esc(img(t.banner_url||t.cover_url))+'" alt="" onerror="this.style.display=\'none\'"><div class="entry-intro"><img class="entry-cover" src="'+esc(img(t.cover_url))+'" alt="'+esc(titleName(t))+'" onerror="this.style.opacity=.2"><div class="entry-info"><div class="eyebrow">'+esc(media(t))+' · '+esc(t.status||'Ongoing')+'</div><h1>'+esc(titleName(t))+'</h1>'+(t.alternative_names?.length?'<p class="muted small">'+esc(t.alternative_names.join(' · '))+'</p>':'')+'<div class="pills">'+genres.map(g=>'<span class="pill">'+esc(g)+'</span>').join('')+'<span class="pill">★ '+esc(Number(t.rating||0).toFixed(1))+'</span></div><p class="muted small">'+esc(t.release_year||'')+(t.chapters?' · '+esc(t.chapters)+' chapters':'')+'</p><div class="entry-actions"><button class="btn primary" data-save="'+esc(t.id)+'">'+(state.library.has(t.id)?'♥ Saved to library':'♡ Add to library')+'</button><button class="btn" data-jump-comments>↓ Reviews & comments</button>'+(t.source_url?'<a class="btn" href="'+esc(img(t.source_url))+'" target="_blank" rel="noopener">Official source ↗</a>':'')+'</div></div></div></section><div class="detail-layout"><div><section class="panel"><h2>Overview</h2><p class="overview">'+esc(t.synopsis||'No overview has been added yet.')+'</p></section><section class="panel" style="margin-top:18px"><h2>Characters</h2>'+chars+'</section></div><aside class="panel"><h2>Details</h2>'+facts(t)+'</aside></div><section id="entry-community" class="panel community"><div class="community-top"><div><div class="eyebrow">Community</div><h2 style="margin:7px 0 0">Reviews & comments</h2><p class="muted small" style="margin-top:7px">Your thoughts belong right here, under the overview and entry details.</p></div><span class="pill">'+(state.reviews.length+state.comments.length)+' posts</span></div>'+(state.user?'<form id="review-form" class="review-form"><label class="field">Your rating<select name="rating"><option value="10">10 — Masterpiece</option><option value="9">9 — Excellent</option><option value="8">8 — Great</option><option value="7">7 — Good</option><option value="6">6 — Fine</option><option value="5">5 — Average</option><option value="4">4 — Weak</option><option value="3">3 — Poor</option><option value="2">2 — Bad</option><option value="1">1 — Terrible</option></select></label><label class="field">Write a comment or review<textarea name="body" maxlength="3000" placeholder="What did you think? Share theories, favourite moments, or recommendations…"></textarea></label><label class="field">Image or GIF (optional, max 8 MB)<input name="media" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><div class="admin-actions"><button class="btn primary" type="submit">Post comment</button><span class="muted small" id="review-status" aria-live="polite">Posting requires a signed-in account.</span></div></form>':'<div class="empty" style="margin:18px 0"><p>Sign in to join the conversation.</p><button class="btn primary" data-auth-open>Sign in to comment</button></div>')+'<div id="entry-posts">'+reviewCards()+'</div></section></article>'}
function library(){if(!state.user)return '<section class="section">'+topTitle('My library','Keep your reading list in one place')+'<div class="empty">Sign in to save titles to your library.<br><br><button class="btn primary" data-auth-open>Sign in</button></div></section>';const titles=state.titles.filter(t=>state.library.has(t.id));return '<section class="section">'+topTitle('My library','Your saved stories')+(titles.length?'<div class="library-list">'+titles.map(t=>'<div class="library-row"><img src="'+esc(img(t.cover_url))+'" alt=""><div class="grow"><strong>'+esc(titleName(t))+'</strong><div class="muted small">'+esc(media(t))+' · '+esc(t.status||'Ongoing')+'</div><button class="chip" data-open="'+esc(t.id)+'" style="margin-top:8px">View title</button></div><button class="chip" data-save="'+esc(t.id)+'">Remove</button></div>').join('')+'</div>':'<div class="empty">Your library is empty. Open a title and tap “Add to library”.</div>')+'</section>'}
function authPage(){return '<section class="auth-layout panel"><div class="eyebrow">Your 7MANGA account</div><h1>Welcome back.</h1><p class="muted">Sign in to comment, review stories and keep your library synced.</p><form id="auth-form" class="form-stack"><label class="field">Email<input type="email" name="email" autocomplete="email" required></label><label class="field">Password<input type="password" name="password" minlength="6" autocomplete="current-password" required></label><div class="admin-actions"><button class="btn primary" type="submit">Sign in</button><button class="btn" type="button" id="signup-btn">Create account</button><button class="btn" type="button" id="reset-btn">Reset password</button></div><p class="muted small" id="auth-status" aria-live="polite"></p></form>'+(state.user?'<button class="btn" id="signout-btn">Sign out · '+esc(state.user.email)+'</button>':'')+'</section>'}
function adminPage(){if(!state.admin)return '<section class="section"><div class="empty">Admin studio is restricted to approved administrators.</div></section>';return '<section class="section">'+topTitle('Admin studio','Manage the catalogue. Changes are still enforced by Supabase row-level security')+'<div class="panel"><form id="admin-form" class="form-stack"><input type="hidden" name="id"><div class="admin-grid"><label class="field">Title name *<input name="name" required maxlength="200"></label><label class="field">Media type<select name="media_type"><option>Manga</option><option>Manhwa</option><option>Manhua</option><option>Anime</option><option>Light Novel</option><option>Web Novel</option></select></label><label class="field wide">Alternative names (comma separated)<input name="alternative_names"></label><label class="field">Cover image URL<input name="cover_url" type="url"></label><label class="field">Banner image URL<input name="banner_url" type="url"></label><label class="field wide">Synopsis<textarea name="synopsis" maxlength="10000"></textarea></label><label class="field">Genres (comma separated)<input name="genres"></label><label class="field">Themes (comma separated)<input name="themes"></label><label class="field">Status<select name="status"><option>Ongoing</option><option>Completed</option><option>Hiatus</option><option>Upcoming</option><option>Cancelled</option></select></label><label class="field">Release year<input name="release_year" type="number" min="1900" max="2100"></label><label class="field">Rating (0–10)<input name="rating" type="number" min="0" max="10" step=".1"></label><label class="field">Chapters<input name="chapters"></label><label class="field">Episodes<input name="episodes"></label><label class="field">Author<input name="author"></label><label class="field">Artist<input name="artist"></label><label class="field">Studio<input name="studio"></label><label class="field">Country<input name="country"></label><label class="field">Source URL<input name="source_url" type="url"></label><label class="field">AniList ID<input name="anilist_id" type="number" min="1"></label><label class="field">Character name (optional)<input name="character_name"></label><label class="field">Character image URL<input name="character_image" type="url"></label><label class="field">Character role<input name="character_role" placeholder="Main"></label><label class="field wide">Character description<input name="character_description"></label><label class="field"><span><input type="checkbox" name="is_featured"> Featured on hero</span></label><label class="field"><span><input type="checkbox" name="is_trending"> Trending</span></label></div><div class="admin-actions"><button class="btn primary" type="submit" id="admin-save">Save title</button><button class="btn" type="button" id="admin-clear">Clear form</button><button class="btn" type="button" id="anilist-fetch">Fetch AniList metadata</button></div><p id="admin-status" class="muted small"></p></form></div><section class="section">'+topTitle('Manage titles','Edit or remove a catalogue entry')+grid(state.titles)+'</section></section>'}
function render(){applyFilters();let route=location.hash.replace(/^#/, '')||'/';state.route=route;if(route.startsWith('/title/')){const id=route.slice(7),t=state.titles.find(x=>x.id===id);if(!t){app.innerHTML='<div class="empty">Loading entry…</div>';return}state.selected=t;app.innerHTML=entry(t)}else if(route==='/browse')app.innerHTML=browse();else if(route==='/library')app.innerHTML=library();else if(route==='/account')app.innerHTML=authPage();else if(route==='/admin')app.innerHTML=adminPage();else if(route==='/about')app.innerHTML='<section class="section panel"><div class="eyebrow">About</div><h1>Stories beyond worlds.</h1><p class="overview">7MANGA is a community catalogue for manga, manhwa, manhua, anime and more. Discover stories, save favourites, and share your thoughts with other readers.</p></section>';else app.innerHTML=home();bindPage();window.scrollTo({top:0,behavior:'instant'})}
function bindPage(){app.querySelectorAll('[data-open]').forEach(el=>{const open=()=>openTitle(el.dataset.open);el.addEventListener('click',e=>{if(e.target.closest('button[data-save]'))return;open()});el.addEventListener('keydown',e=>{if(e.key==='Enter')open()})});app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});app.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{state.slide=Number(b.dataset.slide);render()});app.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveTitle(b.dataset.save));app.querySelectorAll('[data-auth-open]').forEach(b=>b.onclick=()=>location.hash='#/account');app.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{if(history.state?.route)history.back();else location.hash='#/browse'});app.querySelectorAll('[data-jump-comments]').forEach(b=>b.onclick=()=>document.getElementById('entry-community')?.scrollIntoView({behavior:'smooth'}));app.querySelectorAll('[data-delete-post]').forEach(b=>b.onclick=()=>deletePost(b.dataset.deletePost,b.dataset.kind));const af=document.getElementById('auth-form');if(af)bindAuth(af);const rf=document.getElementById('review-form');if(rf)rf.onsubmit=submitReview;const admin=document.getElementById('admin-form');if(admin)bindAdmin(admin)}
async function saveTitle(id){if(!state.user){location.hash='#/account';return notify('Sign in to save titles.')}if(state.library.has(id)){const {error}=await db.from('user_library').delete().eq('user_id',state.user.id).eq('title_id',id);if(error)return notify(error.message);state.library.delete(id);notify('Removed from your library')}else{const {error}=await db.from('user_library').upsert({user_id:state.user.id,title_id:id},{onConflict:'user_id,title_id'});if(error)return notify(error.message);state.library.add(id);notify('Saved to your library')}render()}
async function submitReview(e){e.preventDefault();if(!state.user)return notify('Sign in to comment');const form=e.currentTarget,t=state.selected,status=form.querySelector('#review-status'),body=form.elements.body.value.trim(),file=form.elements.media.files[0],rating=Number(form.elements.rating.value);if(!body&&!file){status.textContent='Write a comment or attach an image.';return}if(file&&(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)||file.size>8*1024*1024)){status.textContent='Choose a JPEG, PNG, WEBP or GIF under 8 MB.';return}const button=form.querySelector('button[type=submit]');button.disabled=true;status.textContent='Posting…';try{let media_url=null,media_type=null;if(file){const ext=(file.name.split('.').pop()||'img').toLowerCase().replace(/[^a-z0-9]/g,'');const path=state.user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const up=await db.storage.from('community-media').upload(path,file,{contentType:file.type});if(up.error)throw up.error;media_url=db.storage.from('community-media').getPublicUrl(path).data.publicUrl;media_type=file.type==='image/gif'?'gif':'image'}if(body){const ins=await db.from('community_comments').insert({title_id:t.id,user_id:state.user.id,body,media_url,media_type});if(ins.error)throw ins.error;if(rating){const {data:existing}=await db.from('title_reviews').select('id').eq('title_id',t.id).eq('user_id',state.user.id).maybeSingle();const payload={rating,review:body,updated_at:new Date().toISOString()};const res=existing?await db.from('title_reviews').update(payload).eq('id',existing.id):await db.from('title_reviews').insert({title_id:t.id,user_id:state.user.id,...payload});if(res.error)console.warn('Rating review could not be saved:',res.error.message)}}else{const ins=await db.from('community_comments').insert({title_id:t.id,user_id:state.user.id,body:'',media_url,media_type});if(ins.error)throw ins.error}form.reset();await loadEntryExtras(t.id);render();document.getElementById('entry-community')?.scrollIntoView({behavior:'smooth'});notify('Your comment was posted')}catch(err){status.textContent=err.message||'Unable to post. Try again.'}finally{button.disabled=false}}
async function deletePost(id,kind){if(!confirm('Delete this post?'))return;const table=kind==='review'?'title_reviews':'community_comments';const {error}=await db.from(table).delete().eq('id',id).eq('user_id',state.user?.id);if(error)return notify(error.message);await loadEntryExtras(state.selected.id);render();notify('Post deleted')}
function bindAuth(form){form.onsubmit=async e=>{e.preventDefault();const status=form.querySelector('#auth-status');status.textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:form.elements.email.value.trim(),password:form.elements.password.value});status.textContent=error?error.message:'Signed in.';if(!error){await refreshUser();render();notify('Signed in')}};document.getElementById('signup-btn').onclick=async()=>{const email=form.elements.email.value.trim(),password=form.elements.password.value;if(!email||password.length<6){form.querySelector('#auth-status').textContent='Enter email and password (at least 6 characters).';return}const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});form.querySelector('#auth-status').textContent=error?error.message:(data.session?'Account created.':'Check your email to confirm your account, then sign in.');};document.getElementById('reset-btn').onclick=async()=>{const email=form.elements.email.value.trim();if(!email){form.querySelector('#auth-status').textContent='Enter your email first.';return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+'#/account'});form.querySelector('#auth-status').textContent=error?error.message:'Password reset email sent if that account exists.'};document.getElementById('signout-btn')?.addEventListener('click',async()=>{await db.auth.signOut();await refreshUser();location.hash='#/';render()})}
function bindAdmin(form){form.onsubmit=async e=>{e.preventDefault();if(!state.admin)return notify('Admin access required');const f=form.elements,st=form.querySelector('#admin-status'),id=f.id.value;const data={name:f.name.value.trim(),media_type:f.media_type.value,alternative_names:f.alternative_names.value.split(',').map(x=>x.trim()).filter(Boolean),cover_url:f.cover_url.value.trim(),banner_url:f.banner_url.value.trim(),synopsis:f.synopsis.value.trim(),genres:f.genres.value.split(',').map(x=>x.trim()).filter(Boolean),themes:f.themes.value.split(',').map(x=>x.trim()).filter(Boolean),status:f.status.value,release_year:f.release_year.value?Number(f.release_year.value):null,rating:f.rating.value?Number(f.rating.value):null,chapters:f.chapters.value||null,episodes:f.episodes.value||null,author:f.author.value||null,artist:f.artist.value||null,studio:f.studio.value||null,country:f.country.value||null,source_url:f.source_url.value||null,anilist_id:f.anilist_id.value?Number(f.anilist_id.value):null,is_featured:f.is_featured.checked,is_trending:f.is_trending.checked,updated_at:new Date().toISOString()};st.textContent='Saving…';const res=id?await db.from('titles').update(data).eq('id',id).select('id').single():await db.from('titles').insert(data).select('id').single();if(res.error){st.textContent=res.error.message;return}const charName=f.character_name.value.trim();if(charName){const ch=await db.from('characters').insert({title_id:res.data.id,name:charName,role:f.character_role.value||'Supporting',image_url:f.character_image.value||'',description:f.character_description.value||''});if(ch.error)st.textContent='Title saved, but character failed: '+ch.error.message;else st.textContent='Title and character saved.'}else st.textContent='Title saved.';await loadTitles();render()};document.getElementById('admin-clear').onclick=()=>form.reset();document.getElementById('anilist-fetch').onclick=()=>fetchAniList(form)}
async function fetchAniList(form){const id=Number(form.elements.anilist_id.value);if(!id){notify('Enter an AniList ID first.');return}const status=form.querySelector('#admin-status');status.textContent='Fetching AniList metadata…';const query='query ($id:Int){Media(id:$id){id title{romaji english native} description(asHtml:false) type format status startDate{year} averageScore genres tags{name} coverImage{extraLarge large} bannerImage season seasonYear chapters episodes countryOfOrigin staff(perPage:10,sort:RELEVANCE){edges{role node{name{full}}}} characters(perPage:20,sort:ROLE){edges{role node{name{full} image{large} description(asHtml:false)}}}}}';try{const res=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables:{id}})});const json=await res.json();const m=json.data?.Media;if(!m)throw Error(json.errors?.[0]?.message||'No AniList title found');const f=form.elements;f.name.value=m.title.english||m.title.romaji||m.title.native||'';f.alternative_names.value=[m.title.romaji,m.title.native].filter(Boolean).filter(x=>x!==f.name.value).join(', ');f.synopsis.value=(m.description||'').replace(/<[^>]*>/g,'');f.genres.value=(m.genres||[]).join(', ');f.status.value=({'RELEASING':'Ongoing','FINISHED':'Completed','NOT_YET_RELEASED':'Upcoming','CANCELLED':'Cancelled','HIATUS':'Hiatus'})[m.status]||'Ongoing';f.release_year.value=m.startDate?.year||m.seasonYear||'';f.rating.value=m.averageScore?Math.round(m.averageScore/10*10)/10:'';f.chapters.value=m.chapters||'';f.episodes.value=m.episodes||'';f.country.value=m.countryOfOrigin||'';f.anilist_id.value=m.id;f.cover_url.value=m.coverImage?.extraLarge||m.coverImage?.large||'';f.banner_url.value=m.bannerImage||'';const staff=m.staff?.edges||[];f.author.value=staff.find(x=>/story|original creator/i.test(x.role))?.node?.name?.full||'';f.artist.value=staff.find(x=>/art|illustration/i.test(x.role))?.node?.name?.full||'';window.pendingAniCharacters=(m.characters?.edges||[]).map(x=>({name:x.node.name.full,role:x.role||'Supporting',image_url:x.node.image?.large||'',description:x.node.description||''}));status.textContent='Metadata filled. Save the title to apply it; '+window.pendingAniCharacters.length+' characters fetched.'}catch(e){status.textContent='AniList fetch failed: '+e.message}}
document.getElementById('global-search').addEventListener('input',e=>{state.search=e.target.value;applyFilters();if(!['/title/','/account','/admin'].some(x=>state.route.startsWith(x))){if(state.route==='/')render();else if(state.route==='/browse')render()}});
document.getElementById('account-btn').onclick=()=>{location.hash='#/account'};document.getElementById('mobile-account').onclick=()=>{location.hash='#/account'};document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>location.hash=b.dataset.route);document.getElementById('year').textContent=new Date().getFullYear();
window.addEventListener('hashchange',()=>{render()});window.addEventListener('popstate',()=>{render()});
db.auth.onAuthStateChange(async()=>{await refreshUser();if(state.route.startsWith('/title/')&&state.selected)await loadEntryExtras(state.selected.id);render()});
(async()=>{await refreshUser();await loadTitles();const links=await db.from('site_settings').select('key,value').in('key',['social_links','footer_links']);if(links.data){const setting=Object.fromEntries(links.data.map(x=>[x.key,x.value]));const values=setting.social_links||setting.footer_links||[];if(Array.isArray(values))document.getElementById('footer-links').innerHTML=values.filter(x=>x?.url&&x?.label).map(x=>'<a style="margin-right:14px" href="'+esc(img(x.url))+'" target="_blank" rel="noopener">'+esc(x.label)+'</a>').join('')}render()})();
})();
</script>
</body></html>
